# Residual RL on the new sim2sim_combined.yaml (paddle -50% mass-preserved).
#
# 2026-04-29: target env updated to paddle radius 0.02540 (-50%) with
# paddle mass preserved against source 0.0508. Zero-shot mean dropped
# 95.78 -> 67.54 — much larger gap than the old env's ~5%, so this is
# the FIRST run of an iteration loop on the new (harder) target.
#
# v1 — canonical recipe (recency_top50 + q_wd=1e-3 + rs=0.15) extended
# to 300k. Same hyperparameters as td3_sim2sim_residual.yaml, but:
#   - total_timesteps: 100000 -> 300000  (more budget for harder env)
#   - log_parent_dir / run_name updated to new campaign
#
# Test: does the recipe transfer cleanly from the easy env to the hard
# env? If peak appears later (e.g. >100k) and tail holds, recipe transfers.
# If drift is severe by 100k or peak is below zero-shot, iterate (see v2+).
#
# Eval after training:
#   bash scripts/smooth_policy/eval_all_ckpts_residual.sh \
#     runs/td3/sim2sim/hist2_motion0_to_paddle50/residual_v15_top10_baseline/seed0 \
#     scripts/smooth_policy/amp_history/configs/new_juggle/sim2sim_combined.yaml \
#     cuda:1

total_timesteps: 300000
num_envs: 1

buffer_size: 20000
task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
learning_starts: 2000
policy_lr: 0.0003
q_lr: 0.0003
q_weight_decay: 0.001
q_frequency: 1
q_updates: 4
policy_frequency: 1
target_network_frequency: 2
actor_updates_per_iteration: 1
exploration_noise: 0.05
policy_noise: 0.2
noise_clip: 0.5

per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 50000
per_eps: 0.000001
success_buffer_size: 6000
failure_buffer_size: 14000
success_top_fraction: 0.1
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

exploration_primitive_chance: 0.0
exploration_primitive_chance_start: 0.0
exploration_primitive_chance_pre_learning_starts: 0.0
exploration_primitive_chance_anneal_steps: 50000
exploration_primitive_steps: 5

exploration_primitive_weight_stand_still: 0.0
exploration_primitive_weight_same_direction: 1.0
exploration_primitive_weight_y_aligned: 0.0
exploration_primitive_weight_policy_takeover: 0.0
exploration_primitive_weight_target_position_directional: 0.0

exploration_primitive_weight_anneal_stand_still: 0.0
exploration_primitive_weight_anneal_same_direction: 1.0
exploration_primitive_weight_anneal_y_aligned: 0.0
exploration_primitive_weight_anneal_policy_takeover: 0.0
exploration_primitive_weight_anneal_target_position_directional: 0.0

exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.2
exploration_target_position_max_distance: 0.5
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 5

exploration_policy_takeover_enabled: false
exploration_policy_takeover_model_path: "model2.pth"
exploration_policy_takeover_args_path: "args.yaml"
exploration_policy_takeover_config_path: "config.yaml"

exploration_pre_contact_hit_variant_chance: 0.0
exploration_pre_contact_hit_variant_steps: 5
exploration_pre_contact_hit_variant_distance_threshold: 0.25
exploration_pre_contact_hit_variant_scale_min: 0.5
exploration_pre_contact_hit_variant_scale_max: 1.5
exploration_pre_contact_hit_variant_min_upward_displacement_x: 0.12

task_reward_weight: 1.0
motion_reward_weight: 0.0

stand_still_reward_weight: 0.1
temporal_alignment_reward_weight: 0.0
axis_alignment_reward_weight: 0.0
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

stand_still_threshold: 0.015
temporal_alignment_horizon: 4
velocity_at_one: 0.2
velocity_at_zero: 0.6
jerk_at_one: 8.0
jerk_at_zero: 20.0

config: "scripts/smooth_policy/amp_history/configs/new_juggle/sim2sim_combined.yaml"
enable_puck_delay_interpolation: true

model_path: "runs/td3/hist_motion_collision/hist2_motion0/checkpoint_975000/model.pth"
full_checkpoint_load: "residual"

residual_scale: 0.15

checkpoint_interval: 10000

args_file: null
log_parent_dir: "runs/td3/sim2sim/hist2_motion0_to_paddle50/residual_v15_top10_baseline/seed0"
run_name: "td3_residual_v15_top10_baseline"

device: "cuda:1"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
agent_hidden_size: null
q_hidden_layer_size: 64
q_num_hidden_layers: 2
q_hidden_size: null

use_last_action_in_policy_state: true
