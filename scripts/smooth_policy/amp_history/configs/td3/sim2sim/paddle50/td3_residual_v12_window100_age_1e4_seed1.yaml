# Residual RL on paddle50 — v9: age-weighted PER (priority_age_decay=1e-4).
#
# Implements the OPEN-FOLLOWUP from residual_rl_drift_fix_log.md:
# "Stochastic recency-weighted sampling: weight transitions by inverse-age
# within each buffer. Not implemented yet."
#
# Mechanism: when sampling from the PER buffer, multiply each slot's
# priority by exp(-priority_age_decay * age_in_slots) before alpha-scaling.
# Newest transitions retain full priority; old transitions are exponentially
# down-weighted. This is orthogonal to:
#   - FIFO eviction (v4: shrink success_buffer_size — binary in/out)
#   - TD-error PER (default — uses gradient signal, age-blind)
#
# age_decay=1e-4 → half-life ≈ 6931 slots ≈ 6931 env-steps (num_envs=1).
# So a transition added at step 0 has weight 0.37 by step ~7k, 0.14 by ~14k,
# 0.05 by ~21k. Buffer is 6000 success / 14000 failure → effectively the
# "newest 5-7k transitions dominate sampling" without changing capacity.
#
# Knobs vs v1: priority_age_decay 0.0 → 1e-4. Everything else identical
# (canonical recency_top50 recipe).
#
# Eval after training:
#   bash scripts/smooth_policy/eval_all_ckpts_residual.sh \
#     runs/td3/sim2sim/hist2_motion0_to_paddle50/residual_v12_window100_age_1e4/seed1 \
#     scripts/smooth_policy/amp_history/configs/new_juggle/sim2sim_combined.yaml \
#     cuda:1

total_timesteps: 300000
num_envs: 1

buffer_size: 20000
task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
learning_starts: 2000
policy_lr: 0.0003
q_lr: 0.0003
q_weight_decay: 0.001
q_frequency: 1
q_updates: 4
policy_frequency: 1
target_network_frequency: 2
actor_updates_per_iteration: 1
exploration_noise: 0.05
policy_noise: 0.2
noise_clip: 0.5

per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 50000
per_eps: 0.000001
priority_age_decay: 0.0001          # v9: enable age-weighted PER (half-life ~7k slots)
success_buffer_size: 6000
failure_buffer_size: 14000
success_top_fraction: 0.5
recent_episode_window_size: 100
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

