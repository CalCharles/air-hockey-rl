# Regular (non-residual) fine-tuning on a sim2sim target env.
#
# Tested defaults from the 2026-04-25 hist2_motion0_to_combined campaign.
# Best checkpoint (step 100k) hit deterministic mean 108.64 / tail10 117.4,
# vs zero-shot 95.78 / 87.8. Full writeup, variant table, and rationale:
#   notes/docs/training/sim2sim.md  ("Fine-tune campaign" section).
#
# Two findings baked into the defaults below:
#   1. policy_lr / q_lr were dropped 10x from source-training values. Without
#      this, the warm-started actor moves faster than the (re-bootstrapping)
#      critic can keep up, and FT actively destroys the source policy.
#   2. Exploration primitives are off so the early-FT replay isn't flooded
#      with off-policy heuristic actions while the critic is recovering.
#
# Resumes actor + Q + optimizer state from the source checkpoint via
# full_checkpoint_load=fine_tune. As of the 2026-04-25 patch, the loader
# also explicitly resets policy_lr / q_lr from this config AFTER restoring
# the source's optimizer state — without that fix the source's lrs would
# silently override these knobs (was a real bug; now fixed in td3_training.py).
#
# Replay is seeded with fine_tune_replay_keep samples from the source replay
# (proportional to source success/failure sizes) — see
# helper/td3_checkpointing.py::seed_fine_tune_replay_from_source.
#
# IMPORTANT: this method drifts past its peak with these hyperparams (200k
# extension reduced final-step mean from 108.64 to 62.40). ALWAYS evaluate
# intermediate checkpoints — never use the final-step model.pth as the
# campaign result without verifying earlier checkpoints aren't better.
#
# Before use, update:
#   - config: path to the **target** sim YAML
#   - model_path: path to the source-trained training_state.pth
#     (must be training_state.pth, NOT model.pth — needs Q + optimizer + replay)
#   - log_parent_dir / run_name: per-campaign results dir

# Basic training parameters — FT budget, not full training.
total_timesteps: 100000
num_envs: 1

# TD3 core — reduced buffer/learning-starts for short online FT.
buffer_size: 20000
task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
learning_starts: 2000
policy_lr: 0.00003   # 10x lower than source training to bound actor drift in FT
q_lr: 0.0001         # 10x lower than source training
q_weight_decay: 0.0001
q_frequency: 1
q_updates: 4
policy_frequency: 1
target_network_frequency: 2
actor_updates_per_iteration: 1
exploration_noise: 0.05   # halved vs. base training to preserve base behavior early
policy_noise: 0.2
noise_clip: 0.5

# Prioritized experience replay
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 50000
per_eps: 0.000001
success_buffer_size: 6000
failure_buffer_size: 14000
success_top_fraction: 0.2
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# Primitive exploration disabled to make residual-vs-not comparison clean.
# Selector still requires one non-zero weight at init even when chance==0.
exploration_primitive_chance: 0.0
exploration_primitive_chance_start: 0.0
exploration_primitive_chance_pre_learning_starts: 0.0
exploration_primitive_chance_anneal_steps: 50000
exploration_primitive_steps: 5

exploration_primitive_weight_stand_still: 0.0
exploration_primitive_weight_same_direction: 1.0
exploration_primitive_weight_y_aligned: 0.0
exploration_primitive_weight_policy_takeover: 0.0
exploration_primitive_weight_target_position_directional: 0.0

exploration_primitive_weight_anneal_stand_still: 0.0
exploration_primitive_weight_anneal_same_direction: 1.0
exploration_primitive_weight_anneal_y_aligned: 0.0
exploration_primitive_weight_anneal_policy_takeover: 0.0
exploration_primitive_weight_anneal_target_position_directional: 0.0

exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.2
exploration_target_position_max_distance: 0.5
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 5

exploration_policy_takeover_enabled: false
exploration_policy_takeover_model_path: "model2.pth"
exploration_policy_takeover_args_path: "args.yaml"
exploration_policy_takeover_config_path: "config.yaml"

exploration_pre_contact_hit_variant_chance: 0.0
exploration_pre_contact_hit_variant_steps: 5
exploration_pre_contact_hit_variant_distance_threshold: 0.25
exploration_pre_contact_hit_variant_scale_min: 0.5
exploration_pre_contact_hit_variant_scale_max: 1.5
exploration_pre_contact_hit_variant_min_upward_displacement_x: 0.12

# Dual-head reward decomposition
task_reward_weight: 1.0
motion_reward_weight: 0.0

# Motion reward component weights
stand_still_reward_weight: 0.1
temporal_alignment_reward_weight: 0.0
axis_alignment_reward_weight: 0.0
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

# Motion reward calibration
stand_still_threshold: 0.015
temporal_alignment_horizon: 4
velocity_at_one: 0.2
velocity_at_zero: 0.6
jerk_at_one: 8.0
jerk_at_zero: 20.0

# --- sim2sim targets ---------------------------------------------------------
# Campaign: hist2_motion0 -> sim2sim_combined.
config: "scripts/smooth_policy/amp_history/configs/new_juggle/sim2sim_combined.yaml"
enable_puck_delay_interpolation: true

# Source training-state checkpoint (actor + qf* + targets + optimizers + replay).
# Resume actor + critics + optimizer via fine_tune mode.
model_path: "runs/td3/hist_motion_collision/hist2_motion0/checkpoint_975000/training_state.pth"
full_checkpoint_load: "fine_tune"
# Subsample N total samples from the source replay (split proportionally
# between source success/failure sizes) and seed the fresh target buffers.
fine_tune_replay_keep: 10000

# Save more checkpoints than the default 25k so post-hoc per-checkpoint eval
# can find the peak — this method drifts past peak with these hyperparams.
checkpoint_interval: 10000

args_file: null
log_parent_dir: "runs/td3/sim2sim/hist2_motion0_to_combined/full_ft/seed0"
run_name: "td3_sim2sim_full_ft"

# Runtime
device: "cuda:0"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

# Agent / critic architecture — must match the source checkpoint.
agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
agent_hidden_size: null
q_hidden_layer_size: 64
q_num_hidden_layers: 2
q_hidden_size: null

# Policy state options
use_last_action_in_policy_state: true
