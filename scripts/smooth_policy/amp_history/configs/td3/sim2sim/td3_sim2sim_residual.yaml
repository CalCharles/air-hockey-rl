# Residual RL fine-tuning on a sim2sim target env.
#
# Defaults updated 2026-04-26 after the residual drift-fix campaign on
# hist2_motion0 → sim2sim_combined. 13 variants tested across 200k steps
# (and multi-seed verification of the top 2). See full results in
# notes/scratch/residual_rl_drift_fix_log.md.
#
# Recipe (winner: recency_top50 — best 3-seed stability):
#   - success_top_fraction: 0.5            (median split — most impactful fix!)
#                                          balances success/failure buffers, no museum
#   - q_weight_decay: 0.001                (10x baseline; bounds Q)
#   - residual_scale: 0.15                 (was 0.05; head needs room to learn)
#   - q_updates: 4, q_lr: 0.0003           (lower_qlr settings)
#   - total_timesteps: 100000              (100k is enough)
#
# Mechanism: original drift study traced post-peak collapse to PER+success-
# buffer becoming a "museum of past peaks" + Q-runaway in the critic.
# `success_top_fraction: 0.5` (median split) addresses the museum directly:
# threshold tracks the current policy's median return, ~50% of episodes go
# to success_rb and ~50% to failure_rb at all times. No ratcheting.
#
# 3-seed multi-seed result on hist2_motion0 → sim2sim_combined:
#   peak (3-seed mean): 100.7  (vs zero-shot 95.78)
#   mean across all ckpts: 93.9  (vs no_per+q_wd 79.5)
#   tail (last3): 94.8  (vs no_per+q_wd 72.5)
#   ALL seeds keep last3 ≥ 88 — NO catastrophic collapses
#
# Compared to no_per+q_wd1e3 (the prior winner): same peak, much higher
# mean and tail, no seed-dependent collapse. This is the most stable
# recipe found across the full drift-fix campaign.
#
# Method (frozen base + clipped trainable residual + critic from scratch):
#   notes/scratch/residual_rl_plan.md
#
# OPERATIONAL — REQUIRED for reliable deployment:
#   1. Train 100k steps with checkpoint_interval=10000
#   2. Per-checkpoint deterministic eval (n=50, seed=0) at every 10k step
#   3. Ship the BEST checkpoint, NOT the final one
# Eval driver:
#   bash scripts/smooth_policy/eval_all_ckpts_residual.sh <run_dir> \
#     <target_config> cuda:N
#
# Optional: add `residual_ema_decay: 0.9999` to also save model_ema.pth
# (EMA-averaged residual head). EMA model has lower peak but is more
# stable across the training trajectory — useful as a "safe deploy"
# fallback.
#
# For better statistics, run 3+ seeds and pick the best peak across seeds.

total_timesteps: 100000   # 100k covers the peak window (step 20-60k); past that policy degrades
num_envs: 1

buffer_size: 20000
task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
learning_starts: 2000
policy_lr: 0.0003
q_lr: 0.0003                        # lower_qlr (was 1e-3)
q_weight_decay: 0.001               # 10x baseline; critic L2 bounds Q runaway
q_frequency: 1
q_updates: 4                        # restored to 4 (lower_qlr setting; UTD=1 was earlier "combo" defaults)
policy_frequency: 1
target_network_frequency: 2
actor_updates_per_iteration: 1
exploration_noise: 0.05
policy_noise: 0.2
noise_clip: 0.5

# Data balance — recency_top50 recipe (winner of data-balance ablation).
# Median split: success threshold = median of recent episodes, so success_rb
# and failure_rb each get ~50% of data. This eliminates the "museum of
# past peaks" effect without disabling PER or success sampling entirely.
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 50000
per_eps: 0.000001
success_buffer_size: 6000
failure_buffer_size: 14000
success_top_fraction: 0.5            # median split (was 0.2 = top-20%); MOST IMPACTFUL FIX
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# Exploration primitives disabled for residual — residual_rl_plan.md §3.3.
# Chances are zero so primitives are never sampled; weights need a non-zero
# entry so the selector accepts the distribution at init.
exploration_primitive_chance: 0.0
exploration_primitive_chance_start: 0.0
exploration_primitive_chance_pre_learning_starts: 0.0
exploration_primitive_chance_anneal_steps: 50000
exploration_primitive_steps: 5

exploration_primitive_weight_stand_still: 0.0
exploration_primitive_weight_same_direction: 1.0
exploration_primitive_weight_y_aligned: 0.0
exploration_primitive_weight_policy_takeover: 0.0
exploration_primitive_weight_target_position_directional: 0.0

exploration_primitive_weight_anneal_stand_still: 0.0
exploration_primitive_weight_anneal_same_direction: 1.0
exploration_primitive_weight_anneal_y_aligned: 0.0
exploration_primitive_weight_anneal_policy_takeover: 0.0
exploration_primitive_weight_anneal_target_position_directional: 0.0

exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.2
exploration_target_position_max_distance: 0.5
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 5

exploration_policy_takeover_enabled: false
exploration_policy_takeover_model_path: "model2.pth"
exploration_policy_takeover_args_path: "args.yaml"
exploration_policy_takeover_config_path: "config.yaml"

exploration_pre_contact_hit_variant_chance: 0.0
exploration_pre_contact_hit_variant_steps: 5
exploration_pre_contact_hit_variant_distance_threshold: 0.25
exploration_pre_contact_hit_variant_scale_min: 0.5
exploration_pre_contact_hit_variant_scale_max: 1.5
exploration_pre_contact_hit_variant_min_upward_displacement_x: 0.12

task_reward_weight: 1.0
motion_reward_weight: 0.0

stand_still_reward_weight: 0.1
temporal_alignment_reward_weight: 0.0
axis_alignment_reward_weight: 0.0
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

stand_still_threshold: 0.015
temporal_alignment_horizon: 4
velocity_at_one: 0.2
velocity_at_zero: 0.6
jerk_at_one: 8.0
jerk_at_zero: 20.0

# --- sim2sim targets ---------------------------------------------------------
config: "scripts/smooth_policy/amp_history/configs/new_juggle/sim2sim_combined.yaml"
enable_puck_delay_interpolation: true

# Source actor checkpoint. Loaded into the frozen base; residual head is fresh.
model_path: "runs/td3/hist_motion_collision/hist2_motion0/checkpoint_975000/model.pth"
full_checkpoint_load: "residual"

# Residual action magnitude bound. Drift-fix campaign result (single seed):
#   0.05 = TOO TIGHT under the new defaults (head can't make useful corrections)
#   0.15 = WINNER with critic-side fixes (no_per + q_wd=1e-3); peak 108 @ 40k
#   0.25 = TOO LARGE, actor diverges with this base+target combo (do not use)
residual_scale: 0.15

# Save more checkpoints than the default 25k so post-hoc per-checkpoint eval
# can find the peak — both methods drift past peak with these hyperparams.
checkpoint_interval: 10000

args_file: null
log_parent_dir: "runs/td3/sim2sim/hist2_motion0_to_combined/residual/seed0"
run_name: "td3_sim2sim_residual"

device: "cuda:0"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
agent_hidden_size: null
q_hidden_layer_size: 64
q_num_hidden_layers: 2
q_hidden_size: null

use_last_action_in_policy_state: true
