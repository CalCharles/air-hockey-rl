# Q-only TD3 args:
# - fixed deterministic policy loaded from PPO warm-start model
# - train critics only (no actor updates)
# - same standard TD3 environment/reward settings as td3_standard.yaml

# Basic training parameters
total_timesteps: 1000000
num_envs: 8

# TD3 core
buffer_size: 1000000
task_gamma: 0.975
motion_gamma: 0.8
tau: 0.005
batch_size: 256
learning_starts: 5000
policy_lr: 0.0003
q_lr: 0.001
q_weight_decay: 0.0001
q_frequency: 1
q_updates: 16
policy_frequency: 2
target_network_frequency: 10
exploration_noise: 0.1
policy_noise: 0.1
noise_clip: 0.5

# Primitive exploration takeover
exploration_primitive_chance: 0.05
exploration_primitive_steps: 3
exploration_primitive_weight_policy_takeover: 0.4
exploration_primitive_weight_anneal_policy_takeover: 0.4

# Dual-head reward decomposition
task_reward_weight: 1.0
motion_reward_weight: 1.0

# Motion reward component weights
stand_still_reward_weight: 0.5
temporal_alignment_reward_weight: 0.5
axis_alignment_reward_weight: 0.5
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

# Motion reward calibration
stand_still_threshold: 0.04
temporal_alignment_horizon: 4
velocity_at_one: 0.3
velocity_at_zero: 0.6
jerk_at_one: 10.0
jerk_at_zero: 23.0

# Paths
config: "scripts/smooth_policy/amp_history/configs/new_juggle/pid_noise_constant_upper_half_custom_sim_params.yaml"
args_file: null
model_path: "scripts/smooth_policy/amp_history/amp_training/td3/warm_start/model1.pth"
log_parent_dir: "runs/td3_training/pid/q_only_warm_start_model1"
run_name: "td3_q_only_warm_start_model1"

# Runtime
device: "cuda:0"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

# Agent / critic architecture
agent_hidden_layer_size: 64
agent_num_hidden_layers: 5
agent_hidden_size: null
q_hidden_layer_size: 64
q_num_hidden_layers: 5
q_hidden_size: null

# Policy state options
use_last_action_in_policy_state: true
