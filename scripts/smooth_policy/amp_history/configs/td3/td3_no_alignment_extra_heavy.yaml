# TD3 config: extra-heavy variant
# Density 4000 (paddle + puck), restitution reduced 25%, exploration magnitudes scaled 4/3.
# Sim config bakes in puck delay interpolation + action force attenuation.

# Basic training parameters
total_timesteps: 350000
num_envs: 1

# TD3 core
buffer_size: 100000
task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
learning_starts: 20000
policy_lr: 0.0003
q_lr: 0.001
q_weight_decay: 0.0001
q_frequency: 1
q_updates: 200
policy_frequency: 1
target_network_frequency: 10
actor_updates_per_iteration: 50
exploration_noise: 0.1
policy_noise: 0.2
noise_clip: 0.5


# prioritized experience replay
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 200000
per_eps: 0.000001
success_buffer_size: 30000
failure_buffer_size: 70000
success_top_fraction: 0.2
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# Primitive exploration takeover
exploration_primitive_chance: 0.05
exploration_primitive_chance_start: 0.15

exploration_primitive_chance_pre_learning_starts: 1.0 

exploration_primitive_chance_anneal_steps: 200000
exploration_primitive_steps: 5

# exploration after annealing phase
exploration_primitive_weight_stand_still: 0.2
exploration_primitive_weight_same_direction: 1.0
exploration_primitive_weight_y_aligned: 1.0
exploration_primitive_weight_policy_takeover: 0.2
exploration_primitive_weight_target_position_directional: 1.0

# exploration during annealing phase
exploration_primitive_weight_anneal_stand_still: 0.2
exploration_primitive_weight_anneal_same_direction: 1.0
exploration_primitive_weight_anneal_y_aligned: 1.0 
exploration_primitive_weight_anneal_policy_takeover: 0.2
exploration_primitive_weight_anneal_target_position_directional: 1.0

# exploration specific knobs — magnitudes scaled 4/3 for density 4000
exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.267
exploration_target_position_max_distance: 0.667
exploration_target_position_delta_x: 0.347
exploration_target_position_delta_y: 0.16
exploration_target_position_steps: 5

# demonstration policy takeover source
exploration_policy_takeover_enabled: true
exploration_policy_takeover_model_path: "model2.pth"
exploration_policy_takeover_args_path: "args.yaml"
exploration_policy_takeover_config_path: "config.yaml"

# pre-contact hit variant (disabled) — thresholds scaled 4/3
exploration_pre_contact_hit_variant_chance: 0.0
exploration_pre_contact_hit_variant_steps: 5
exploration_pre_contact_hit_variant_distance_threshold: 0.333
exploration_pre_contact_hit_variant_scale_min: 0.5
exploration_pre_contact_hit_variant_scale_max: 1.5
exploration_pre_contact_hit_variant_min_upward_displacement_x: 0.16

# Dual-head reward decomposition
task_reward_weight: 1.0
motion_reward_weight: 0.01

# Motion reward component weights
stand_still_reward_weight: 0.1
temporal_alignment_reward_weight: 0.0
axis_alignment_reward_weight: 0.0
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

# Motion reward calibration
stand_still_threshold: 0.015
temporal_alignment_horizon: 4
velocity_at_one: 0.2
velocity_at_zero: 0.6
jerk_at_one: 8.0
jerk_at_zero: 20.0
# Paths
config: "scripts/smooth_policy/amp_history/configs/new_juggle/pid_noise_constant_upper_half_custom_sim_params_extra_heavy.yaml"
args_file: null
model_path: null
log_parent_dir: "runs/td3/newest_runs/puck_delay"
run_name: "mw001_d4000_fattn_lowrest"

# Runtime
device: "cuda:0"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

# Agent / critic architecture
agent_hidden_layer_size: 64
agent_num_hidden_layers: 5
agent_hidden_size: null
q_hidden_layer_size: 64
q_num_hidden_layers: 5
q_hidden_size: null

# Policy state options
use_last_action_in_policy_state: true
