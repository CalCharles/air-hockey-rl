# Recommended default TD3 config for:
# scripts/smooth_policy/amp_history/amp_training/td3/td3_training.py
#
# Distilled from ablations documented in
# notes/docs/training/td3-ablations-updates-and-depth.md (network depth + update
# volume/ratio) and notes/docs/training/td3-exploration-ablations.md (bootstrap
# forcing + warm-start weight).
#
# Key choices:
#   - 2-layer actor/critic, 64 hidden (depth sweep: B/C cluster at peak, 2-layer fastest)
#   - q_updates=25, actor_updates_per_iteration=6 (Phase-1/2 sweep: a:q≈0.24, N*=31)
#   - hist_len=4 PID target filter via sysid_best_params_hist2.yaml sim config
#   - No bootstrap forcing: exploration_primitive_chance_pre_learning_starts=null
#     (E4 ablation, +15 pts ret@500k vs bootstrap=1.0 anchor)
#   - No external-policy warmstart: policy_takeover weights = 0 (E2 ablation; avoids
#     dependence on a demo checkpoint, minor steady-state improvement over 0.2)

# Basic training parameters
total_timesteps: 1000000
num_envs: 1

# TD3 core
buffer_size: 100000
task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
learning_starts: 20000
policy_lr: 0.0003
q_lr: 0.001
q_weight_decay: 0.0001
q_frequency: 1
q_updates: 25
policy_frequency: 1
target_network_frequency: 10
actor_updates_per_iteration: 6
exploration_noise: 0.1
policy_noise: 0.2
noise_clip: 0.5

# Prioritized experience replay
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 200000
per_eps: 0.000001
success_buffer_size: 30000
failure_buffer_size: 70000
success_top_fraction: 0.5
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# Primitive exploration takeover
exploration_primitive_chance: 0.05
exploration_primitive_chance_start: 0.15
exploration_primitive_chance_pre_learning_starts: null  # E4: no bootstrap forcing — fall back to chance_start=0.15 during pre-learning
exploration_primitive_chance_anneal_steps: 200000
exploration_primitive_steps: 5

# Exploration after annealing phase
exploration_primitive_weight_stand_still: 0.2
exploration_primitive_weight_same_direction: 1.0
exploration_primitive_weight_y_aligned: 1.0
exploration_primitive_weight_policy_takeover: 0.0  # E2: no external-policy warmstart
exploration_primitive_weight_target_position_directional: 1.0

# Exploration during annealing phase
exploration_primitive_weight_anneal_stand_still: 0.2
exploration_primitive_weight_anneal_same_direction: 1.0
exploration_primitive_weight_anneal_y_aligned: 1.0
exploration_primitive_weight_anneal_policy_takeover: 0.0  # E2: no external-policy warmstart
exploration_primitive_weight_anneal_target_position_directional: 1.0

# Exploration-specific knobs
exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.2
exploration_target_position_max_distance: 0.5
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 5

# Demonstration policy takeover source (disabled — weights above are 0)
exploration_policy_takeover_enabled: false
exploration_policy_takeover_model_path: "model2.pth"
exploration_policy_takeover_args_path: "args.yaml"
exploration_policy_takeover_config_path: "config.yaml"

# Pre-contact hit variant (disabled)
exploration_pre_contact_hit_variant_chance: 0.0
exploration_pre_contact_hit_variant_steps: 5
exploration_pre_contact_hit_variant_distance_threshold: 0.25
exploration_pre_contact_hit_variant_scale_min: 0.5
exploration_pre_contact_hit_variant_scale_max: 1.5
exploration_pre_contact_hit_variant_min_upward_displacement_x: 0.12

# Dual-head reward decomposition
task_reward_weight: 1.0
motion_reward_weight: 0.0

# Motion reward component weights
stand_still_reward_weight: 0.1
temporal_alignment_reward_weight: 0.0
axis_alignment_reward_weight: 0.0
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

# Motion reward calibration
stand_still_threshold: 0.015
temporal_alignment_horizon: 4
velocity_at_one: 0.2
velocity_at_zero: 0.6
jerk_at_one: 8.0
jerk_at_zero: 20.0

# Simulator physics (real-world tuned — see environments/real-world/puck-system-id.md
# and teleop-system-id.md). hist_len=4 variant applies a 4-timestep low-pass
# filter on the PID target (see _filter_update in airhockey/sims/airhockey_box2d.py).
config: "scripts/smooth_policy/amp_history/configs/new_juggle/sysid_best_params_hist2.yaml"
enable_puck_delay_interpolation: true

# Paths
args_file: null
model_path: null
log_parent_dir: "runs/td3/recommended_top50_hist2/seed0"
run_name: "td3_recommended_top50_hist2"

# Runtime
device: "cuda:1"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

# Agent / critic architecture (2-layer, 64 hidden — see ablations doc)
agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
agent_hidden_size: null
q_hidden_layer_size: 64
q_num_hidden_layers: 2
q_hidden_size: null

# Policy state options
use_last_action_in_policy_state: true
