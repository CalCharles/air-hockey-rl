# Example reward parameter sweep config for generate_sweep.py
#
# Usage:
#   uv run scripts/smooth_policy/amp_history/amp_training/td3/helper/generate_sweep.py \
#     --sweep-file scripts/smooth_policy/amp_history/configs/td3/example_reward_sweep.yaml \
#     --output-file run_reward_sweep.sh
#   bash run_reward_sweep.sh          # launch all runs
#   DRY_RUN=1 bash run_reward_sweep.sh  # preview without launching

base_args_file: scripts/smooth_policy/amp_history/configs/td3/td3_no_alignment.yaml
log_parent_dir: /data2/calebc/air_hockey/reward_sweep
run_name_prefix: td3_reward

gpus: [0, 1, 2, 3]
max_parallel: 16  # max runs in flight at once; 0 = launch all immediately

# Eval script generation (--eval-output-file): find TD3 dirs when training used <tag>r1 because an
# empty <tag> existed (legacy) or the dir was reused. Set false to force LOG_BASE/<tag> only.
# eval_resolve_run_dir: true
# Or pin suffix explicitly: eval_run_dir_suffix: r1

# Optional: add these to enable wandb logging for every run in the bash sweep,
# or to use run_wandb_sweep.py for agent-based sweeps.
# wandb_project: my-project-name
# wandb_entity: my-team

# "grid"       -> cartesian product of all param value lists
# "random"     -> random sample of num_samples combos from the product
# "individual" -> one run per value per param, all other params at base config defaults
mode: individual
# num_samples: 16   # only used when mode: random
# random_seed: 42   # seed for reproducible random sampling

# Static overrides applied to every run (on top of base_args_file).
# Leave empty or omit if not needed.
extra_args:
  total_timesteps: 1000000
  checkpoint_freq: 100000
  seed: 0

# Parameters to sweep. Each entry supports one of:
#   values:   [v1, v2, ...]
#   linspace: {start: 0.0, stop: 1.0, num: 5}
#   logspace: {start: -2, stop: 0, num: 5}     # 10^start .. 10^stop
#   range:    {start: 0.0, stop: 1.0, step: 0.25}
params:
  # --- top-level head weights (actor objective) ---
  task_reward_weight:       # default: 1.0
    values: [0.5, 2.0]
  motion_reward_weight:     # default: 0.0
    values: [0.1, 0.25, 0.5, 1.0]
  task_gamma:               # default: 0.985
    values: [0.97, 0.99]
  motion_gamma:             # default: 0.85
    values: [0.7, 0.95]

  # --- motion component weights ---
  stand_still_reward_weight:    # default: 0.1
    values: [0.0, 0.05, 0.2]
  velocity_reward_weight:       # default: 0.5
    values: [0.1, 1.0, 2.0]
  jerk_reward_weight:           # default: 0.5
    values: [0.1, 1.0, 2.0]

  # --- motion reward calibration (reward curve shapes) ---
  stand_still_threshold:        # default: 0.015
    values: [0.005, 0.03]
  temporal_alignment_horizon:   # default: 4
    values: [2, 8]
  velocity_at_one:              # default: 0.2
    values: [0.1, 0.3]
  velocity_at_zero:             # default: 0.6
    values: [0.4, 0.8]
  jerk_at_one:                  # default: 8.0
    values: [4.0, 12.0]
  jerk_at_zero:                 # default: 20.0
    values: [10.0, 30.0]
