# Standard TD3 config for checkpoint-resumed sweeps.
# Based on td3_standard.yaml; this file fills in checkpoint-loading fields.

# Basic training parameters
total_timesteps: 1000000
num_envs: 1

# TD3 core
buffer_size: 100000 # this is already extremely large
task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
learning_starts: 20000
policy_lr: 0.0003
q_lr: 0.001
q_weight_decay: 0.0001
q_frequency: 1
q_updates: 100
policy_frequency: 1
target_network_frequency: 20 # update target networks every 20 critic updates
actor_updates_per_iteration: 50 # actor updates after each full critic update block
exploration_noise: 0.1
policy_noise: 0.2
noise_clip: 0.5


# prioritized experience replay
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 200000
per_eps: 0.000001
success_buffer_size: 30000
failure_buffer_size: 70000
success_top_fraction: 0.2
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# Primitive exploration takeover
exploration_primitive_chance: 0.02 # at the end
exploration_primitive_chance_start: 0.10 # at the start of annealing

# If set, overrides primitive takeover chance while global_step < learning_starts.
exploration_primitive_chance_pre_learning_starts: 1.0

exploration_primitive_chance_anneal_steps: 200000 # around 2000-5000 episodes
exploration_primitive_steps: 5

# exploration after annealing phase
exploration_primitive_weight_stand_still: 1.0
exploration_primitive_weight_same_direction: 0.5
exploration_primitive_weight_y_aligned: 0.5
exploration_primitive_weight_policy_takeover: 0.5
exploration_primitive_weight_target_position_directional: 0.5

# exploration during annealing phase
exploration_primitive_weight_anneal_stand_still: 1.0
exploration_primitive_weight_anneal_same_direction: 0.0
exploration_primitive_weight_anneal_y_aligned: 1.0
exploration_primitive_weight_anneal_policy_takeover: 2.0 # success examples
exploration_primitive_weight_anneal_target_position_directional: 0.5

# exploration specific knobs
exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.2
exploration_target_position_max_distance: 0.5
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 5

# TODO: not clean; demonstration policy takeover source
exploration_policy_takeover_enabled: true
# relative paths are resolved against scripts/smooth_policy/amp_history/amp_training/td3/warm_start
exploration_policy_takeover_model_path: "model2.pth"
exploration_policy_takeover_args_path: "args.yaml"
exploration_policy_takeover_config_path: "config.yaml"

# minor final changes to policy takeover (disabled)
exploration_pre_contact_hit_variant_chance: 0.0
exploration_pre_contact_hit_variant_steps: 5
exploration_pre_contact_hit_variant_distance_threshold: 0.25
exploration_pre_contact_hit_variant_scale_min: 0.5
exploration_pre_contact_hit_variant_scale_max: 1.5
exploration_pre_contact_hit_variant_min_upward_displacement_x: 0.12

# Dual-head reward decomposition
task_reward_weight: 1.0
motion_reward_weight: 0.0

# Motion reward component weights
stand_still_reward_weight: 0.5
temporal_alignment_reward_weight: 0.5
axis_alignment_reward_weight: 0.5
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

# Motion reward calibration
stand_still_threshold: 0.015
temporal_alignment_horizon: 4
velocity_at_one: 0.2
velocity_at_zero: 0.6
jerk_at_one: 8.0
jerk_at_zero: 20.0

# Paths
config: "scripts/smooth_policy/amp_history/configs/new_juggle/pid_noise_constant_upper_half_custom_sim_params.yaml"
args_file: null
model_path: "/home/air-hockey/daliu/air-hockey-rl/runs/td3/final/task_only/checkpoint_20000/training_state.pth"
log_parent_dir: "runs/td3/final/task_only_resume_from_checkpoint"
run_name: "td3_standard_resume_checkpoint"

# Runtime
device: "cuda:0"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

# Agent / critic architecture
agent_hidden_layer_size: 64
agent_num_hidden_layers: 5
agent_hidden_size: null
q_hidden_layer_size: 64
q_num_hidden_layers: 5
q_hidden_size: null

# Policy state options
use_last_action_in_policy_state: true
