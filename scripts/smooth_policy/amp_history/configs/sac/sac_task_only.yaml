# SAC configuration WITH AMP discriminator training
# Uses PID controller with puck_juggle task
# Combines task rewards with style rewards from discriminator

# Training parameters
total_timesteps: 1000000
num_envs: 8

# SAC specific arguments
buffer_size: 100000
gamma: 0.99
tau: 0.005
batch_size: 128 # larger for more learning
learning_starts: 5000
policy_lr: 0.0003
q_lr: 0.001
q_updates: 4
policy_frequency: 1
target_network_frequency: 20
alpha: 0.2
autotune: true

# AMP hyperparameters - DISABLED
disc_replay_buffer_size: 10000
disc_replay_samples: 1024
disc_batch_size: 64
disc_learning_rate: 0.0001
disc_logit_reg: 0.01
disc_grad_penalty: 5.0
disc_weight_decay: 0.0001

# Reward weighting - balanced task + style rewards
task_reward_weight: 1.0
disc_reward_weight: 0.0

# Paths
config: "scripts/smooth_policy/amp_history/configs/pid/pid_default_config.yaml"
args_file: null
model_path: null
discriminator_path: null
amp_components_path: null
log_parent_dir: runs/sac_training/pid/amp
run_name: "sac_amp"
demo_data_path: "scripts/smooth_policy/amp_history/amp_training/amp_data/amp_position_good_dataset.pt"

# Others
seed: 0
device: "cuda:0"
action_scale: 1
agent_hidden_size: 128

# Reference state initialization - disabled
use_reference_state_init: false
reference_data_path: null
ref_max_episode_steps: 30
