# Configuration for AMP training on 5 short trajectories (overfitting verification)
# This config is designed to overfit on the first 100 frames of 5 different trajectories
# Total dataset size: ~480 position sequences (96 sequences per trajectory * 5 trajectories)
# Each sequence contains 5 consecutive positions

# Basic training parameters
num_envs: 8  # Can use more envs with larger dataset
num_steps: 512  # Increased from 64 to ensure enough valid transitions
learning_rate: 0.0001
num_iterations: 1000  # More iterations for overfitting on diverse data
anneal_lr: false
gamma: 0.99
gae_lambda: 0.95
minibatch_size: 32
update_epochs: 10
clip_coef: 0.2
clip_vloss: false
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null
batch_size: 0  # computed at runtime
norm_adv: true

# CAPS hyperparameters (disabled for pure AMP)
caps_coef_nearby: 0.0
caps_coef_consecutive: 0.0

# AMP hyperparameters
disc_replay_buffer_size: 10000  # Slightly larger for more diverse data
disc_replay_samples: 1024  
disc_batch_size: 64  # Can use larger batches with ~495 samples
disc_learning_rate: 0.0001
disc_logit_reg: 0.01
disc_grad_penalty: 5.0
disc_weight_decay: 0.0001
num_discriminator_updates: 5

# Reward weighting - pure imitation focus
task_reward_weight: 0.5
disc_reward_weight: 0.5

# Paths
config: "scripts/smooth_policy/amp_history/configs/pid/amp_better_reward_config.yaml"
args_file: null
model_path: null  # Start from scratch
discriminator_path: null  # Start from scratch
amp_components_path: null  # Start from scratch
log_parent_dir: runs/amp_training/pid/test
run_name: "pid_test"
demo_data_path: "scripts/smooth_policy/amp_history/amp_training/amp_data/amp_position_good_dataset.pt"

# Others
seed: 0
device: "cuda:0"
action_scale: 0.2

# Reference state initialization - CRITICAL for overfitting
# This ensures the agent starts from states similar to the demonstrations
use_reference_state_init: false
reference_data_path: null  # Will default to demo_data_path
ref_max_episode_steps: 30  # Slightly longer episodes with more diverse data

agent_hidden_size: 128 # larger actor