# Source: sim2sim_combined.yaml (paddle50, mass-preserved + dynamics deltas)
#
# Sim2sim target combining the three perturbations meant to mirror real-world
# transfer challenges, so that adaptation working here builds confidence in
# real-world adaptation:
#
#   (1) Smaller paddle             — already in sim2sim_combined (paddle_radius
#                                    halved, mass preserved).
#   (2) Systematic puck obs error  — NEW: edge-preserving sine y-warp on puck
#                                    observations (paddle obs untouched).
#                                    Models a partially-calibrated tracker
#                                    where corners are anchored to the table
#                                    edges but interior reads bow off-true.
#   (3) Different dynamics         — already in sim2sim_combined (pid_kp -20%,
#                                    action delay enabled, wider wall cone, ...).
#
# The sine warp formula:
#   y_obs = y_true + A * sin(pi * (y_true - y_left) / (y_right - y_left))
# Edges preserved (sin(0) = sin(pi) = 0), peak +A at y = 0. Monotonic for
# any |A| < (y_right - y_left) / pi ≈ 0.275 m at the full table width.
#
# Default A = 0.05 m: at the midpoint the policy reads the puck about one
# paddle50-diameter off, which is enough to matter for contact without making
# the task crippling.
#
# Source policy: latest_model/hist2_motion0_v2/

air_hockey:
  diagonal_motion_rew: 0.0
  direction_change_rew: 0.0
  goal_max_x_velocity: 1
  goal_max_y_velocity: 5
  goal_min_y_velocity: 1
  horizontal_vel_rew: 0.0
  max_timesteps: 250
  n_training_steps: 1000000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  return_goal_obs: false
  seed: 0

  puck_spawn_near_paddle_prob: 0.15
  puck_near_paddle_offset_min_m: 0.025
  puck_near_paddle_offset_max_m: 0.05
  puck_near_paddle_horizontal_std_m: 0.015
  puck_near_paddle_speed_min_m_s: 0.0
  puck_near_paddle_speed_max_m_s: 0.2

  puck_linear_top_spawn_goal_cutoff_x: null
  puck_linear_top_spawn_center_cutoff_x: 0.2
  puck_linear_top_spawn_speed_min: 0.0
  puck_linear_top_spawn_speed_max: 0.5

  simulator: box2d
  simulator_params:
    absorb_target: false
    block_density: 1000
    block_width: 0.0254
    length: 1.9304
    max_force_timestep: 10000
    paddle_radius: 0.02540                   # PERTURBED: 0.0508 * 0.5 (-50%)
    paddle_mass_reference_radius: 0.0508     # preserve paddle mass against source (density auto-scales 3000 -> 12000)
    force_scaling: 0.99
    paddle_damping: 17
    paddle_density: 3000
    gravity: -0.661
    puck_damping: 0.178
    puck_density: 3000
    puck_restitution: 0.87316
    paddle_restitution: 0.8
    side_wall_restitution: 0.925
    end_wall_restitution: 0.7
    puck_radius: 0.03175
    render_size: 360
    seed: 0
    width: 0.8636
    use_pid: true
    pid_kp: 7200                    # PERTURBED: 9000 * 0.8 (-20%)
    pid_kd: 50
    pid_ki: 0.0

    hist_len: 4

    puck_noise: true
    puck_noise_std: 0.01
    enable_random_occlusions: true
    random_occlusion_target_rate: 0.025
    random_occlusion_other_region_rate: 0.025
    random_occlusion_length_weights: [75, 39, 18, 9, 4, 2, 1]
    random_occlusion_bad_region_box_x: [-0.4, -0.35]
    random_occlusion_bad_region_box_y: [-0.3, 0.0]
    random_occlusion_bad_region_right_x: [0.35, 0.8]
    random_occlusion_near_paddle_boost: true
    random_occlusion_near_paddle_distance_m: 0.05
    random_occlusion_near_paddle_rate_multiplier: 3.0
    enable_action_delay: true       # PERTURBED: false -> true
    enable_observation_delay: true
    delay_seconds: 0.030            # PERTURBED: 0.025 * 1.2 (+20%)
    randomize_delay: true
    delay_relative_range: 0.35      # PERTURBED: 0.25 -> 0.35 (carried over from v2, clipped)
    delay_jitter_distribution: "normal"  # PERTURBED: uniform -> normal-clipped (carried over from v2)
    enable_action_force_attenuation: true
    action_force_attenuation_prob: 0.30
    action_force_attenuation_min: 0.25
    action_force_attenuation_max: 0.75

    # Per-collision randomization.
    # Paddle-puck: strength (magnitude multiplier) + direction (impulse rotation).
    enable_paddle_puck_strength_randomization: true
    paddle_puck_strength_range: [0.5, 1.0]
    enable_paddle_puck_direction_randomization: true
    paddle_puck_direction_cone_deg: 10.0
    # Puck-wall: direction only (no wall strength knob by design).
    enable_wall_direction_randomization: true
    wall_direction_cone_deg: 25.0   # PERTURBED: 10.0 -> 25.0 (wider angular cone)

    # PERTURBED (NEW): edge-preserving sine y-warp on puck observations.
    # paddle obs untouched; physics untouched. y_left / y_right default to
    # the table side walls (-width/2, +width/2) when left null.
    puck_obs_sine_warp_amplitude: 0.05
    puck_obs_sine_warp_y_left: null
    puck_obs_sine_warp_y_right: null

  stand_still_rew: 0.0
  task: puck_juggle_upper_half_reward
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
  truncate_rew: 0
  wall_bumping_rew: 0
  use_reward_shaping: true
  use_smooth_penalty: false
  base_reward_scaling: 1
