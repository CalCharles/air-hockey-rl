# Configuration for RMA + AMP (LSGAN) training.
# This is modeled after pid/amp_default.yaml but only includes
# arguments supported by amp_training/rma/amp_training_rma_lsgan.py.

# Basic training parameters
num_envs: 64
num_steps: 512
learning_rate: 0.0001
num_iterations: 10000 # more iterations for testing
anneal_lr: false
gamma: 0.99
gae_lambda: 0.95
minibatch_size: 256
update_epochs: 5 # 10 is a lot over the data
clip_coef: 0.2
clip_vloss: false
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null
batch_size: 0  # computed at runtime
norm_adv: true

# AMP hyperparameters
disc_replay_buffer_size: 100000
disc_replay_samples: 4096
disc_batch_size: 512
disc_learning_rate: 0.00001
disc_logit_reg: 0.01
disc_grad_penalty: 5.0
disc_weight_decay: 0.0001
task_reward_weight: 0.5
disc_reward_weight: 0.5
num_discriminator_updates: 3
disc_hidden_sizes: [128, 128]

use_long_discriminator: true
long_disc_reward_weight: 0.5
long_disc_replay_buffer_size: 100000
long_disc_replay_samples: 4096
long_disc_batch_size: 512
long_disc_learning_rate: 0.00001
long_disc_logit_reg: 0.01
long_disc_grad_penalty: 5.0
long_disc_weight_decay: 0.0001
long_num_discriminator_updates: 3
long_disc_hidden_sizes: [128, 128]
long_history_len: 30
long_num_bins: 3
long_samples_per_bin: 2
long_puck_current_index: 15

# Optional auxiliary rewards
temporal_alignment_reward_scale: 0.75
action_magnitude_reward_scale: 0.75
temporal_alignment_horizon: 4

# Paths
config: "scripts/smooth_policy/amp_history/configs/new_juggle/new_pid_noise.yaml"
args_file: null
model_path: null
encoder_path: null
discriminator_path: null
long_discriminator_path: null
amp_components_path: null
long_amp_components_path: null
log_parent_dir: "runs/rma/test_amp_training/run"
run_name: "rma_default"
demo_data_path: "scripts/smooth_policy/amp_history/amp_training/amp_data/amp_paddle_puck_dataset.pt" # paddle and puck

# Others
seed: 0
device: "cuda:0"
use_last_action_in_policy_state: true
action_scale: 1
agent_hidden_size: 1024
agent_weight_decay: 0.00001

# RMA randomization + encoder args
num_randomized_envs_total: 1000
env_var_dim: 8
env_latent_dim: 12
env_encoder_hidden_size: [256, 256]
edge_eval_episodes: 5
edge_eval_interval: 10
model_save_interval: 50

# Action-conditioned discriminator
use_action_discriminator: false
use_puck_discriminator: false
puck_vertical_pos_min: -1.0
puck_vertical_pos_max: 1.0
disc_debug_interval: 5000
