# Joint stage-1 + stage-2 RMA evaluation config.

# Paths/configs.
config: "scripts/smooth_policy/amp_history/configs/new_juggle/pid_noise_config.yaml"
args_file: null
model_path: "runs/rma_stage1/checkpoint_100/model.pth"
encoder_path: "runs/rma_stage1/checkpoint_100/encoder.pth"
adaptation_path: "runs/rma_adaptation/default_run/adaptation_module_best.pth"
env_spec_pool_path: "runs/rma_stage1/env_spec_pool.pt"
explicit_env_specs_path: ""
log_parent_dir: null
run_name: "rma_joint_eval"

# Runtime + architecture compatibility.
seed: 0
eval_env_seed: 123
device: "cuda:0"
action_scale: 1.0
agent_hidden_size: 512
use_last_action_in_policy_state: true
env_var_dim: 8
env_latent_dim: 8
env_encoder_hidden_size: 64
adaptation_embed_dim: 16
adaptation_conv_in_channels: 8
adaptation_hidden_size: 64
ppo_model_path: ""
ppo_agent_hidden_size: 256
ppo_action_scale: 1.0
ppo_use_last_action_in_policy_state: true

# Evaluation setup.
num_eval_env_specs: 25
episodes_per_env: 5
warmstart_steps: 75
adaptation_min_context: 50
use_tensorboard: true
save_gifs: true
gif_episodes_per_env: 1
gif_max_steps: 250
gif_fps: 20