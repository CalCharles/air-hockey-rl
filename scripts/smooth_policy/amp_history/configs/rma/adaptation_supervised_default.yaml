# Stage-2 RMA supervised adaptation training.
# Trains adaptation module to regress frozen encoder latents with MSE.

# Paths
config: "scripts/smooth_policy/amp_history/configs/new_juggle/pid_noise_config.yaml"
args_file: null
model_path: "runs/rma_stage1/checkpoint_100/model.pth"
encoder_path: "runs/rma_stage1/checkpoint_100/encoder.pth"
env_spec_pool_path: "runs/rma_stage1/env_spec_pool.pt"
log_parent_dir: "runs/rma_adaptation/default_run"
run_name: "rma_adaptation_supervised"

# Runtime
seed: 0
device: "cuda:0"
num_envs: 16

# Stage-1 architecture compatibility
use_last_action_in_policy_state: true
action_scale: 1.0
agent_hidden_size: 512
env_var_dim: 8
env_latent_dim: 8
env_encoder_hidden_size: 64

# Adaptation network
adaptation_embed_dim: 16
adaptation_conv_in_channels: 8
adaptation_hidden_size: 64

# Rollout/data setup
train_env_count: 500
eval_env_count: 100
rollout_len: 200
prior_min: 50 # 10 is too short and unreasonable for convolution
prior_max: 100
min_model_context_len: 16
latent_noise_std: 0.10
rollout_seed_offset: 1000

# Optimization
num_iterations: 2000
train_steps_per_iter: 16
minibatch_size: 256
learning_rate: 0.0001
weight_decay: 0.000001
max_grad_norm: 1.0

# Logging/checkpointing
eval_interval: 10
checkpoint_interval: 50
print_interval: 1
