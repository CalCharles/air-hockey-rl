# Base config for non-EIPO AMP ablations.
# Matches eipo_target.yaml architecture/data settings exactly so comparisons are fair.
# use_eipo: false — fixed task/disc weights, no Lagrangian balancing, no disc smoothing.
#
# Run via launch_ablations.sh (CLI args override these values per variant).

num_envs: 8
num_steps: 512
learning_rate: 0.0001
num_iterations: 10000
anneal_lr: false
gamma: 0.99
gae_lambda: 0.95
minibatch_size: 32
update_epochs: 10
clip_coef: 0.2
clip_vloss: false
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null
batch_size: 0
norm_adv: true

use_last_action_in_policy_state: true

# AMP hyperparameters — defaults matching eipo_target.yaml
use_action_discriminator: false
disc_replay_buffer_size: 50000
disc_replay_samples: 2048
disc_batch_size: 256
disc_learning_rate: 0.0001
disc_logit_reg: 0.01
disc_grad_penalty: 5.0
disc_weight_decay: 0.0001
num_discriminator_updates: 3
disc_hidden_layer_size: 64
disc_num_hidden_layers: 3

# Fixed reward weights (overridden per variant)
task_reward_weight: 0.5
disc_reward_weight: 0.5

include_inherited_reward: false

temporal_alignment_reward_scale: 0.4
action_magnitude_reward_scale: 0.4

# Paths
config: "scripts/smooth_policy/amp_history/configs/new_juggle/pid_noise_constant_upper_half_custom_sim_params.yaml"
args_file: null
model_path: null
discriminator_path: null
amp_components_path: null
run_name: "amp_ablation"
log_parent_dir: "runs/ablations/amp"
demo_data_path: "scripts/smooth_policy/amp_history/amp_training/amp_data/all_trajectories_bc.pt"

seed: 0
device: "cuda:0"
action_scale: 1

use_reference_state_init: false
reference_data_path: null
ref_max_episode_steps: 30

agent_hidden_layer_size: 64
agent_num_hidden_layers: 5

# EIPO disabled
use_eipo: false

# Checkpoint every 500 iterations
checkpoint_freq: 500
