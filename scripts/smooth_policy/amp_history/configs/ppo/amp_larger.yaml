# Configuration for AMP training on 5 short trajectories (overfitting verification)
# This config is designed to overfit on the first 100 frames of 5 different trajectories
# Total dataset size: ~480 position sequences (96 sequences per trajectory * 5 trajectories)
# Each sequence contains 5 consecutive positions

# to run: python scripts/smooth_policy/amp_history/amp_training/amp_training_lsgan.py --args-file scripts/smooth_policy/
# amp_history/configs/ppo/amp_larger.yaml --device=cuda:0

# Basic training parameters
num_envs: 8  # Can use more envs with larger dataset
num_steps: 512  # Increased from 64 to ensure enough valid transitions
learning_rate: 0.0001
num_iterations: 5000  # More iterations for overfitting on diverse data
anneal_lr: false
gamma: 0.99
gae_lambda: 0.95
minibatch_size: 32
update_epochs: 10
clip_coef: 0.2
clip_vloss: false
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null
batch_size: 0  # computed at runtime
norm_adv: true

use_last_action_in_policy_state: true

# AMP hyperparameters
use_action_discriminator: false
disc_replay_buffer_size: 50000  # Slightly larger for more diverse data
disc_replay_samples: 2048  
disc_batch_size: 256
disc_learning_rate: 0.0001
disc_logit_reg: 0.01
disc_grad_penalty: 5.0
disc_weight_decay: 0.0001
num_discriminator_updates: 3
disc_hidden_layer_size: 64
disc_num_hidden_layers: 3

# Reward weighting
task_reward_weight: 0.5
disc_reward_weight: 0.5

# Whether to add the inherited LinearTop/PuckJuggle reward on top of upper_half_reward
include_inherited_reward: false

# reward terms
temporal_alignment_reward_scale: 0.4
action_magnitude_reward_scale: 0.4

# Paths
config: "scripts/smooth_policy/amp_history/configs/new_juggle/pid_noise_constant_upper_half_custom_sim_params.yaml"
args_file: null
model_path: null  # Start from scratch
discriminator_path: null  # Start from scratch
amp_components_path: null  # Start from scratch
run_name: "b8_equal_weights_with_inherited_reward"
log_parent_dir: "runs/amp_baselines/b8_equal_weights_with_inherited_reward"
demo_data_path: "scripts/smooth_policy/amp_history/amp_training/amp_data/all_trajectories_bc.pt"

# Others
seed: 0
device: "cuda:0"
action_scale: 1

# Reference state initialization - CRITICAL for overfitting
# This ensures the agent starts from states similar to the demonstrations
use_reference_state_init: false
reference_data_path: null  # Will default to demo_data_path
ref_max_episode_steps: 30  # Slightly longer episodes with more diverse data

agent_hidden_layer_size: 64 # larger actor
agent_num_hidden_layers: 5