# Config for:
# scripts/smooth_policy/amp_history/amp_training/td3/async_td3_real_reset_policy.py

args_file: null
config: "scripts/smooth_policy/amp_history/configs/new_juggle/pid_noise_constant_upper_half_custom_sim_params.yaml"
model_path: null
device: "cuda:0"
seed: 0

# TD3 single-stream
gamma: 0.99
tau: 0.005
batch_size: 256
q_lr: 0.0001
q_weight_decay: 0.0001
policy_lr: 0.00005
q_updates: 10
actor_updates_per_iteration: 2
target_network_frequency: 2
min_replay_size_before_learning: 1000
policy_noise: 0.2
noise_clip: 0.5
exploration_noise: 0.1
h_transform_eps: 0.001

# Replay and warm-start
buffer_size: 300000
warm_start_hdf5_dirs: ["real_runs/online_run/reset_hdf5"]
warm_start_hdf5_recursive: true
min_episode_timesteps: 20

# Network
action_scale: 1.0
agent_hidden_layer_size: 64
agent_num_hidden_layers: 5
q_hidden_layer_size: 64
q_num_hidden_layers: 5
use_last_action_in_policy_state: true

# Reset-window behavior
max_reset_window_steps: 120
reset_failure_bottom_margin: 0.25
reset_failure_bottom_fail_count: 2
reset_failure_occluded_fail_count: 6

# Runtime / logging
max_env_steps: 150000
collector_log_interval_sec: 30.0
log_parent_dir: "runs/td3_training/reset_policy"
run_name: "td3_reset_online"
