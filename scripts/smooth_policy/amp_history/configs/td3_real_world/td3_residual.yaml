# Real-world residual RL fine-tuning on top of a frozen sim-trained base.
#
# Mirrors scripts/smooth_policy/amp_history/configs/td3/sim2sim/td3_sim2sim_residual.yaml
# but with the real-world async knobs from td3_online.yaml. The recipe
# (`recency_top50` data balance + critic L2 + residual_scale=0.15) is
# identical to sim2sim. See:
#   notes/docs/training/residual-rl-recipe.md
#
# Method (frozen base + clipped trainable residual + critic from scratch):
#   - full_checkpoint_load: "residual"
#   - actor.base loads from `model_path` and is frozen
#   - actor.residual head is zero-init, trained from scratch, output bound by
#     residual_scale and clipped to env action bounds
#   - critic + critic-target are fresh
#   - replay is warm-started from `warm_start_hdf5_dirs` (NOT from a stale
#     source replay buffer); residual must NEVER inherit a checkpoint replay
#
# OPERATIONAL — REQUIRED for reliable deployment:
#   1. Train with `enable_periodic_checkpointing: true`
#   2. Per-checkpoint deterministic eval
#   3. Ship the BEST checkpoint, NOT the final one
#
# Optional: set `residual_ema_decay: 0.9999` to also save model_ema.pth (an
# EMA-averaged copy of the residual head). EMA is more stable across the
# training trajectory, useful as a "safe deploy" fallback.

# --- Residual mode ----------------------------------------------------------
full_checkpoint_load: "residual"
# Source actor checkpoint (frozen base). Replace with a real path before launching.
model_path: "runs/td3_training/pid/standard/checkpoint_975000/model.pth"
residual_scale: 0.15                 # head needs corrections > +-5%; same as sim2sim winner
residual_weight_decay: 0.0           # no actor L2 by default; critic L2 below carries drift control
residual_ema_decay: null             # set to 0.9999 to also save model_ema.pth
residual_action_l2: 0.0              # alternative drift control; default off

# --- TD3 core ---------------------------------------------------------------
task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
min_replay_size_before_learning: 0
policy_lr: 0.0003                    # sim2sim residual recipe (was 0.00005 in td3_online)
q_lr: 0.0003                         # lower_qlr (was 1e-4 in td3_online)
q_weight_decay: 0.001                # 10x baseline; bounds Q runaway
q_updates: 4                         # lower_qlr setting (was 20 in td3_online)
target_network_frequency: 2          # standard residual setting
actor_updates_per_iteration: 1
exploration_noise: 0.05
policy_noise: 0.2
noise_clip: 0.5

# --- Replay sources ---------------------------------------------------------
# Warm-start replay from prior real-world data. Residual REQUIRES this — there
# is no fresh-buffer-fill phase like sim2sim has, and a stale checkpoint replay
# would teach the new critic to value the source dynamics.
warm_start_hdf5_dirs: ['real_runs/warm_start_trajectories']
warm_start_hdf5_recursive: true
replay_source_priority: "warmstart_only"
load_replay_from_checkpoint: false
checkpoint_root_dir: 'real_runs/checkpoints/residual'
include_non_vital_training_state_fields: false
enable_periodic_checkpointing: true
checkpoint_every_successful_online_episodes: 10

# --- Data balance — recency_top50 winner ------------------------------------
success_buffer_size: 30000
failure_buffer_size: 70000
success_top_fraction: 0.5            # MEDIAN split (was 0.2 in td3_online); MOST IMPACTFUL FIX
recent_episode_window_size: 250
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# --- Exploration primitives -------------------------------------------------
# sim2sim residual disables primitives; for real-world residual we keep them
# at low chance — exploration is more valuable here than in sim due to
# perception/control noise. Tune down if base policy already covers the
# state space well.
exploration_primitive_chance: 0.025
exploration_primitive_chance_start: 0.025
exploration_primitive_chance_anneal_steps: 0
exploration_primitive_steps: 5
exploration_primitive_weight_stand_still: 0.0
exploration_primitive_weight_same_direction: 0.25
exploration_primitive_weight_y_aligned: 1.0
exploration_primitive_weight_target_position_directional: 0.25

exploration_same_direction_min_angle_deg: -180.0
exploration_same_direction_max_angle_deg: 180.0
exploration_same_direction_min_magnitude: 0.075
exploration_same_direction_max_magnitude: 0.150
exploration_y_aligned_min_angle_deg: 45.0
exploration_y_aligned_max_angle_deg: 135.0
exploration_y_aligned_min_magnitude: 0.075
exploration_y_aligned_max_magnitude: 0.175
exploration_target_position_directional_min_angle_deg: -180.0
exploration_target_position_directional_max_angle_deg: 180.0
exploration_target_position_directional_min_magnitude: 0.075
exploration_target_position_directional_max_magnitude: 0.175
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 7

# --- Reward weights ---------------------------------------------------------
task_reward_weight: 1.0
motion_reward_weight: 0.025

stand_still_reward_weight: 0.1
temporal_alignment_reward_weight: 0.0
axis_alignment_reward_weight: 0.0
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

stand_still_threshold: 0.015
temporal_alignment_horizon: 4
velocity_at_one: 0.2
velocity_at_zero: 0.6
jerk_at_one: 8.0
jerk_at_zero: 20.0

# --- Paths ------------------------------------------------------------------
config: "configs/real_configs/rollout_config.yaml"
args_file: null
log_parent_dir: "runs/async_td3/residual"
run_name: "async_td3_real_residual"

# --- Runtime ----------------------------------------------------------------
learner_device: "cuda:0"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

# --- Architecture (must match the source `model_path` checkpoint) -----------
agent_hidden_layer_size: 64
agent_num_hidden_layers: 5
q_hidden_layer_size: 64
q_num_hidden_layers: 5

use_last_action_in_policy_state: true
