# Configuration for AMP training on 5 short trajectories (overfitting verification)
# This config is designed to overfit on the first 100 frames of 5 different trajectories
# Total dataset size: ~495 state pairs (99 pairs per trajectory * 5 trajectories)
# 
# Usage:
#   1. First prepare the multi-trajectory dataset:
#      python scripts/smooth_policy/amp_no_rotation_data/prepare_multi_trajectory_dataset.py \
#        --config-file scripts/smooth_policy/amp_no_rotation_data/five_trajectories_config.json \
#        --output-path scripts/smooth_policy/amp_no_rotation_data/five_trajectories_first100.pt
#
#   2. Then run training:
#      python scripts/smooth_policy/amp_no_rotation/amp_training_lsgan.py \
#        --args-file scripts/smooth_policy/amp_no_rotation/overfit_five_trajectories_args.yaml

# Basic training parameters
num_envs: 8  # Can use more envs with larger dataset
num_steps: 128  # Increased from 64 to ensure enough valid transitions
learning_rate: 0.0001
num_iterations: 400  # More iterations for overfitting on diverse data
anneal_lr: false
gamma: 0.99
gae_lambda: 0.95
minibatch_size: 32
update_epochs: 10
clip_coef: 0.2
clip_vloss: false
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null
batch_size: 0  # computed at runtime
norm_adv: true

# CAPS hyperparameters (disabled for pure AMP)
caps_coef_nearby: 0.0
caps_coef_consecutive: 0.0

# AMP hyperparameters - tuned for ~495 state pairs
disc_replay_buffer_size: 2000  # Slightly larger for more diverse data
disc_replay_samples: 512  # More replay sampling
disc_batch_size: 64  # Can use larger batches with ~495 samples
disc_learning_rate: 0.0001
disc_logit_reg: 0.01
disc_grad_penalty: 5.0
disc_weight_decay: 0.0001
num_discriminator_updates: 1

# Reward weighting - pure imitation focus
task_reward_weight: 0.0  # Disable task reward to focus purely on style matching
disc_reward_weight: 1.0  # Maximize discriminator reward (style matching)

# Paths
config: "scripts/smooth_policy/configs/paddle_free_movement/default_config.yaml"
args_file: null
model_path: null  # Start from scratch
discriminator_path: null  # Start from scratch
amp_components_path: null  # Start from scratch
log_parent_dir: amp_test/runs
run_name: "overfit_five_trajs_first100"
demo_data_path: "scripts/smooth_policy/amp_no_rotation_data/five_trajectories_first100.pt"

# Others
seed: 0
device: "cuda:0"
action_scale: 0.02

# Reference state initialization - CRITICAL for overfitting
# This ensures the agent starts from states similar to the demonstrations
use_reference_state_init: true
reference_data_path: null  # Will default to demo_data_path
ref_max_episode_steps: 20  # Slightly longer episodes with more diverse data
