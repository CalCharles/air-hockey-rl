

# This file is akin to sim_..._.yaml. which contains all the info relevant to the environment/simulator - which here is robosuite
# We want to change this to support robosuite (because rn it is a copy from box2d)


# System-ID best-fit parameters
#
# Puck:   grid search over gx ∈ [-1.2, 0] × γ ∈ [0, 1.5] on 10 real-world
#         puck trajectory segments. Best: gx=-0.661, γ=0.178 (2.86 cm mean error).
#         See notes/docs/environments/real-world/puck-system-id.md
#
# Paddle: multiple grid searches (2D PID → 3D PID+density → fine → windowed)
#         on 8 teleop categories from trajectory_data3.
#         Fine 3D with puck: Kp=7500, Kd=100, density=2750 (best paddle err).
#         Chosen practical best: Kp=9000, Kd=50, density=3000 (render_best_config_all.py).
#         Ki sweep: Ki=0 best for full-segment replay.
#         See sysid/teleop/system_id3/grid_search_results_*/
#
# Walls:  side_wall_restitution reverted to 0.99 (v1 / latest_model/hist2_motion0
#         legacy value) so the canonical sim's bounce coefficients match the v1
#         model's training sim. The 0.925 sysid-fit value is documented in
#         notes/docs/environments/real-world/wall-collision-system-id.md but
#         abandoned in the canonical config in favor of v1↔v2 cross-model
#         consistency (the v1→v2 delta is now purely collision randomization).
#         Decision: 2026-05-05 zero-shot-ablations setup.

air_hockey:
  diagonal_motion_rew: 0.0
  direction_change_rew: 0.0
  goal_max_x_velocity: 1
  goal_max_y_velocity: 5
  goal_min_y_velocity: 1
  horizontal_vel_rew: 0.0
  max_timesteps: 250
  n_training_steps: 1000000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  return_goal_obs: false
  seed: 0

  puck_spawn_near_paddle_prob: 0.15
  puck_near_paddle_offset_min_m: 0.025
  puck_near_paddle_offset_max_m: 0.05
  puck_near_paddle_horizontal_std_m: 0.015
  puck_near_paddle_speed_min_m_s: 0.0
  puck_near_paddle_speed_max_m_s: 0.2

  puck_linear_top_spawn_goal_cutoff_x: null
  puck_linear_top_spawn_center_cutoff_x: 0.2
  puck_linear_top_spawn_speed_min: 0.0
  puck_linear_top_spawn_speed_max: 0.5

  simulator: robosuite      # TODO: Changed to "robosuite" from "box2d"
  simulator_params:
    absorb_target: false
    block_density: 1000         # keep
    block_width: 0.0254         # keep
    length: 1.9304
    # max_force_timestep: 10000  # removed
    paddle_radius: 0.0508       # keep
    # force_scaling: 0.99         # removed
    # paddle_damping: 17          # removed
    # paddle_density: 3000        # removed
    # gravity: -0.661             # Removed
    puck_damping: 0.178         # keep
    puck_density: 3000          # keep
    # Restitution reverted to v1 values (see header comment).
    puck_restitution: 1.09145
    paddle_restitution: 1.0
    side_wall_restitution: 0.99
    end_wall_restitution: 0.7
    puck_radius: 0.03175        # keep
    render_size: 360
    seed: 0
    width: 0.8636
    use_pid: true
    # pid_kp: 9000            # removed
    # pid_kd: 50              # removed
    # pid_ki: 0.0             # removed
  
    # puck_noise: true        # removed
    # puck_noise_std: 0.01    # removed
    # enable_random_occlusions: true    # removed

    # I assume below are removed because we removed "enable_random_occlusions"
    # random_occlusion_target_rate: 0.025
    # random_occlusion_other_region_rate: 0.025
    # random_occlusion_length_weights: [75, 39, 18, 9, 4, 2, 1]
    # random_occlusion_bad_region_box_x: [-0.4, -0.35]
    # random_occlusion_bad_region_box_y: [-0.3, 0.0]
    # random_occlusion_bad_region_right_x: [0.35, 0.8]
    # random_occlusion_near_paddle_boost: true
    # random_occlusion_near_paddle_distance_m: 0.05
    # random_occlusion_near_paddle_rate_multiplier: 3.0


    # enable_action_delay: false          # removed
    # enable_observation_delay: true      # removed but see TODO at line 768 in readme - we might do something with this later but for now removed
    # delay_seconds: 0.025                # removed
    randomize_delay: true
    delay_relative_range: 0.25
    # enable_action_force_attenuation: true # removed

    # Assumed to be removed because we removed "enable_action_force_attenuation"
    # action_force_attenuation_prob: 0.30
    # action_force_attenuation_min: 0.25
    # action_force_attenuation_max: 0.75

    # Optional per-collision randomization (all off by default).
    # Paddle-puck: strength (magnitude multiplier) + direction (impulse rotation).
    # enable_paddle_puck_strength_randomization: false      # removed
    # paddle_puck_strength_range: [0.5, 1.0]                # removed
    # enable_paddle_puck_direction_randomization: false     # removed
    # paddle_puck_direction_cone_deg: 10.0                  # removed

    # Removed the above because readme stated "enable_paddle_puck_strength_randomization etc. is not implemented in robosuite"

    # Puck-wall: direction only (no wall strength knob by design).
    enable_wall_direction_randomization: false
    wall_direction_cone_deg: 10.0

  stand_still_rew: 0.0
  task: puck_juggle_upper_half_reward
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
  truncate_rew: 0
  wall_bumping_rew: 0
  use_reward_shaping: true
  use_smooth_penalty: false
  base_reward_scaling: 1
