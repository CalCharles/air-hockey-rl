# --train-args spec for the v27 real-world residual recipe.
#
# Loaded by `_load_train_args` in helper/real_td3_runtime.py. Carries:
#   - actor/critic architecture (must match the source actor in `model_path`)
#   - `use_last_action_in_policy_state` (must match the source's policy-state contract)
#   - `num_critics` and `target_critic_subset_size` (the v27 ensemble settings)
#
# In residual mode the critic is built fresh from this spec — `num_critics: 5`
# spins up Maxmin-5 regardless of the source actor's original critic count.
# So even if the frozen base was trained with N=2, this file makes the new
# residual run use the v27 Maxmin-5 ensemble.
#
# Companion args-file:
#   configs/td3_real_world/td3_residual.yaml
#
# IMPORTANT — match the source actor's architecture:
#   - The architecture fields below MUST match the network depth/width that
#     the actor was trained with. If your `model_path` points at a 2-layer
#     base (e.g. v27 paddle50 hist2 source), set both num_hidden_layers to 2.
#     If it points at a 5-layer real-world base (the legacy default), keep 5.
#   - `use_last_action_in_policy_state` must also match the source — flipping
#     it changes the actor's input dim and breaks state_dict loading.

action_scale: 1.0

# Architecture — v27 standard (2-layer 64-wide hist-style base, matching the
# sim2sim winner). MUST match the source actor in `model_path`. If your base
# is the older 5-layer real-world model, set both num_hidden_layers to 5
# (the model.pth state_dict will fail to load otherwise).
agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
q_hidden_layer_size: 64
q_num_hidden_layers: 2

use_last_action_in_policy_state: true

# Critic ensemble — v27 Maxmin-5. This is the load-bearing knob for residual
# fine-tuning; see notes/docs/training/residual-rl-recipe.md.
num_critics: 5
target_critic_subset_size: null   # null → Maxmin (min over all 5). Set to 2 for REDQ-5-2.
