# Standard TD3 config for:
# scripts/td3/td3_training.py
#
# Modeled after ppo/amp_larger.yaml structure, but aligned to TD3 args.

task_gamma: 0.985
motion_gamma: 0.85
tau: 0.005
batch_size: 512
min_replay_size_before_learning: 0
policy_lr: 0.00005 # lower learning rate for online training
q_lr: 0.0001
q_weight_decay: 0.0001
q_updates: 20
target_network_frequency: 10 # update target networks every 2 critic updates
actor_updates_per_iteration: 5 # actor updates after each full critic update block
exploration_noise: 0.1
policy_noise: 0.2
noise_clip: 0.5


# TODO: Initial replay buffer directories
warm_start_hdf5_dirs: ['real_runs/warm_start_trajectories'] # e.g. ["real_runs/online_run"] (recursive walk picks up data_<ts>/episode_hdf5/<bucket>/*.hdf5)
warm_start_hdf5_recursive: true
# Replay bootstrap source policy:
# - warmstart_only: use only warm_start_hdf5_dirs
# - checkpoint_only: load replay only from model_path checkpoint
# - checkpoint_then_append: load checkpoint replay, then append warm-start dirs
replay_source_priority: "checkpoint_only"
load_replay_from_checkpoint: false # if model_path points to a checkpoint with replay
checkpoint_root_dir: 'real_runs/checkpoints/default' # optional override for periodic checkpoint location
include_non_vital_training_state_fields: true # required to resume training cleanly: includes optimizer state, learner-update counters, collector_total_steps, run_elapsed_total_s, and rolling-window deques. Set to false ONLY if you do not intend to resume from these checkpoints. See notes/docs/training/real-world-resume.md.
enable_periodic_checkpointing: true
checkpoint_every_collector_steps: 5000
total_timesteps: 100000  # 0 disables the cap (run until Ctrl-C). On resume `collector_total_steps` carries across, so a 50k checkpoint resumed with cap=100k runs for 50k more.


# experience replay
success_buffer_size: 30000
failure_buffer_size: 70000
success_top_fraction: 0.2
recent_episode_window_size: 250
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# Primitive exploration takeover (keep exploration high for learning purposes)
exploration_primitive_chance: 0.025 # pretty high exploration chance for learning purposes
exploration_primitive_chance_start: 0.025 # at the start of annealing

exploration_primitive_chance_anneal_steps: 0 # around 2000-5000 episodes
exploration_primitive_steps: 5
exploration_primitive_weight_stand_still: 0.00
exploration_primitive_weight_same_direction: 0.25
exploration_primitive_weight_y_aligned: 1.0
exploration_primitive_weight_target_position_directional: 0.25

# exploration specific knobs
# Angles are in simulator displacement coordinates:
#   0 deg = +x (right), 90 deg = +y (up), 180/-180 deg = -x (left), -90 deg = -y (down)
# The sampler is uniform over [min_angle_deg, max_angle_deg].
# To cover the full circle, use [-180, 180], [0, 360], or any span >= 360 deg.
# If max_angle_deg < min_angle_deg, the range wraps around across the branch cut.
# Magnitudes are simulator-space per-step displacements before conversion into normalized action space.
# For `y_aligned`, the sampled angle band is mirrored to the puck-relative y sign automatically.
# Legacy action-space skew knob kept for compatibility; simulator-space ranges below drive real primitive sampling.
exploration_same_direction_min_angle_deg: -180.0
exploration_same_direction_max_angle_deg: 180.0
exploration_same_direction_min_magnitude: 0.075
exploration_same_direction_max_magnitude: 0.150
exploration_y_aligned_min_angle_deg: 45.0
exploration_y_aligned_max_angle_deg: 135.0
exploration_y_aligned_min_magnitude: 0.075
exploration_y_aligned_max_magnitude: 0.175
exploration_target_position_directional_min_angle_deg: -180.0
exploration_target_position_directional_max_angle_deg: 180.0
exploration_target_position_directional_min_magnitude: 0.075
exploration_target_position_directional_max_magnitude: 0.175
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 7 # more coherent than before

# Dual-head reward decomposition
task_reward_weight: 1.0
motion_reward_weight: 0.025 # lower motion reward for training juggling

# Motion reward component weights
stand_still_reward_weight: 0.1
temporal_alignment_reward_weight: 0.0
axis_alignment_reward_weight: 0.0
velocity_reward_weight: 0.5
jerk_reward_weight: 0.5

# Motion reward calibration
stand_still_threshold: 0.015
temporal_alignment_horizon: 4
velocity_at_one: 0.2
velocity_at_zero: 0.6
jerk_at_one: 8.0
jerk_at_zero: 20.0

# Paths
config: "configs/real_configs/rollout_td3_config.yaml"
args_file: null
model_path: null
log_parent_dir: "runs/td3_training/pid/standard"
run_name: "td3_standard"

# Runtime
learner_device: "cuda:0"
seed: 0
action_scale: 1.0
h_transform_eps: 0.001

# Agent / critic architecture
agent_hidden_layer_size: 64
agent_num_hidden_layers: 5
q_hidden_layer_size: 64
q_num_hidden_layers: 5

# Policy state options
use_last_action_in_policy_state: true




# IGNORED BY ASYNC TD3 REAL:
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.65
per_beta_end: 0.65
per_beta_anneal_steps: 0
per_eps: 0.000001
total_timesteps: 1000000
num_envs: 1
buffer_size: 100000
q_frequency: 1
policy_frequency: 1