# Real-world residual RL fine-tuning — CQL recipe (canonical big-gap default, 2026-05-08).
#
# Mirrors the sim2sim winner
#   configs/td3/sim2sim/warp075_p30_residual/phaseC_actor2_1M.yaml
# but adapted for the async real-world pipeline (HDF5 warm-start replay,
# real-robot exploration tradeoffs, periodic checkpointing).
#
# CQL recipe = the v27 ensemble base + two load-bearing additions:
#   - cql_alpha: 20.0                  ← Conservative-Q penalty on the task-Q head
#   - cql_n_random: 10                 ← uniform random actions per state for the logsumexp term
#   - actor_updates_per_iteration: 2   ← strongest single knob in the 2026-05-08 hyperparam campaign
#
# Everything else (Maxmin-5, success_top_fraction=0.15, residual_scale=0.15,
# no exploration, no BC anchor, q_weight_decay=1e-3) matches the v27 baseline.
#
# Companion --train-args file (architecture, num_critics=5, target_critic_subset_size=null):
#   configs/td3_real_world/td3_residual_train_args.yaml
# This file is shared with the v27 recipe — architecture is identical, only the
# behavior knobs in the args-file differ. Pass it via --train-args; passing this
# args-file on its own is not enough.
#
# Read `notes/docs/training/residual-rl-recipe.md` (the "big-gap CQL recipe"
# section) before launching. The recipe is sim2sim verified through warp 0.10
# (paddle -10% with actor_updates=4); this real-world config uses the canonical
# actor_updates=2 setting (paddle-30% gap, the most thoroughly verified point).
#
# Method (frozen base + clipped trainable residual + critic from scratch +
# CQL penalty on task head):
#   - full_checkpoint_load: "residual"
#   - actor.base loads from `model_path` and is frozen
#   - actor.residual head is zero-init, trained from scratch, output bound by
#     residual_scale and clipped to env action bounds
#   - critic + critic-target are fresh (5 of them when num_critics=5)
#   - critic loss = Bellman-MSE + cql_alpha * (logsumexp_a Q_task(s,a) - Q_task(s, pi(s)))
#   - replay is warm-started from `warm_start_hdf5_dirs` (NOT from a stale
#     source replay buffer); residual must NEVER inherit a checkpoint replay
#
# OPERATIONAL — REQUIRED for reliable deployment:
#   1. Train with `enable_periodic_checkpointing: true`
#   2. Per-checkpoint deterministic eval
#   3. Ship the BEST checkpoint, NOT the final one
#
# Optional: set `residual_ema_decay: 0.9999` to also save model_ema.pth (an
# EMA-averaged copy of the residual head). EMA is more stable across the
# training trajectory; useful as a "safe deploy" fallback.
#
# Launch (fresh start — empty warm-start, mirrors sim2sim):
#
#   python -m scripts.td3.extras.async_td3_real \
#     --train-args configs/td3_real_world/td3_residual_train_args.yaml \
#     --args-file  configs/td3_real_world/td3_residual_cql.yaml \
#     --model-path <path-to-source-checkpoint>/training_state.pth
#
# (Note: `--model-path` must point at a `training_state.pth`, NOT a `model.pth`.
# The loader needs the full state dict; the residual mode then extracts just
# the `actor` key as the frozen base and discards everything else.)
#
# Resuming a residual run from a previous checkpoint (skip fresh-fill, restore
# the trained residual head + critics + optimizer + replay):
#
#   python -m scripts.td3.extras.async_td3_real \
#     --train-args configs/td3_real_world/td3_residual_train_args.yaml \
#     --args-file  configs/td3_real_world/td3_residual_cql.yaml \
#     --full-checkpoint-load residual_resume \
#     --learning-starts-fresh-steps 0 \
#     --load-replay-from-checkpoint \
#     --model-path <prev-run>/checkpoint_<tag>/training_state.pth
#
# The resume command requires the prior run to have been saved with
# `include_non_vital_training_state_fields: true` (the default in this YAML).

# --- Residual mode ----------------------------------------------------------
full_checkpoint_load: "residual"
model_path: "runs/td3_training/pid/standard/checkpoint_975000/training_state.pth"
residual_scale: 0.15
residual_weight_decay: 0.0
residual_ema_decay: null
residual_action_l2: 0.0

# --- TD3 core (CQL recipe) --------------------------------------------------
tau: 0.005
batch_size: 512
min_replay_size_before_learning: 0
policy_lr: 0.0003
q_lr: 0.0003
q_weight_decay: 0.001
q_updates: 4                         # real-world default: 4 critic updates per episode boundary (sim2sim phaseC uses q_updates=1 per env step; the async-real learner is invoked once per episode, so q_updates here = critic gradient steps per episode).
target_network_frequency: 2
actor_updates_per_iteration: 2       # CQL recipe — strongest single knob in the 2026-05-08 hyperparam campaign (+10 vs v27 at 300k).
exploration_noise: 0.05
policy_noise: 0.2
noise_clip: 0.5

# --- CQL penalty (the load-bearing addition over v27) -----------------------
# Conservative-Q penalty on the task-Q head: pushes Q(s, random_a) DOWN and
# Q(s, pi(s)) UP, preventing the critic from extrapolating optimistically into
# OOD residual regions. Penalty = alpha * (logsumexp_a Q(s,a) - Q(s, pi(s))).
# Gated on cql_alpha > 0 — set cql_alpha: 0.0 to fall back to pure v27 behavior.
# See td3_training.py CQL block (~line 1893) and the sim2sim `redesign_cql`
# winner (notes/docs/training/residual-rl-recipe.md "Canonical big-gap recipe").
cql_alpha: 20.0
cql_n_random: 10

# Fresh-buffer-fill phase — mirrors sim2sim's `learning_starts: 2000`.
learning_starts_fresh_steps: 2000

# --- Replay sources — empty start, mirrors sim2sim --------------------------
# Same posture as v27: empty warm-start, no checkpoint-replay inheritance,
# fresh-fill phase before the first gradient step.
warm_start_hdf5_dirs: []
warm_start_hdf5_recursive: true
replay_source_priority: "warmstart_only"
load_replay_from_checkpoint: false
checkpoint_root_dir: 'real_runs/checkpoints/residual_cql'
include_non_vital_training_state_fields: true
enable_periodic_checkpointing: true
checkpoint_every_collector_steps: 5000
total_timesteps: 100000

# --- Data balance — top-15% (matches sim2sim CQL recipe) --------------------
success_buffer_size: 6000
failure_buffer_size: 14000
success_top_fraction: 0.15
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# --- Exploration primitives — disabled (matches CQL recipe) -----------------
# CQL recipe (and v27) leave adaptation-phase primitive exploration off.
# The 2026-05-08 ablations confirmed CQL+exploration drops back-half by 19-31.
exploration_primitive_chance: 0.0
exploration_primitive_chance_start: 0.0
exploration_primitive_chance_anneal_steps: 50000
exploration_primitive_steps: 5

exploration_primitive_weight_stand_still: 0.0
exploration_primitive_weight_same_direction: 1.0
exploration_primitive_weight_y_aligned: 0.0
exploration_primitive_weight_target_position_directional: 0.0

exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.2
exploration_target_position_max_distance: 0.5
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 5

# --- Reward weights — matches sim2sim CQL recipe ----------------------------



# --- Paths ------------------------------------------------------------------
config: "configs/real_configs/rollout_config_residual.yaml"
args_file: null
log_parent_dir: "runs/async_td3/residual_cql"
run_name: "async_td3_real_residual_cql"

# --- Runtime ----------------------------------------------------------------
learner_device: "cuda:0"
seed: 0
h_transform_eps: 0.001

# --- Architecture (informational; effective values come from --train-args) --
# Architecture is loaded at runtime from the --train-args YAML (TrainArgs).
# Duplicated here so the args-file is self-describing — keep in sync with
# td3_residual_train_args.yaml.
agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
q_hidden_layer_size: 64
q_num_hidden_layers: 2

use_last_action_in_policy_state: true
