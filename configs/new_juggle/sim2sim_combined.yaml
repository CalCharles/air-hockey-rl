# Source: sysid_best_params_hist4.yaml
#
# Sim2sim target — combined perturbations across movement, delay, and collision
# physics. Same task / obs (history) / action space as source. Only the keys
# called out below differ from the source config.
#
# Updated 2026-04-29 after the mass-preserved radius sweep
# (notes/scratch/sim2sim_delay_puck_perturbation_sweep.md). Old sim2sim_combined
# shrank paddle_radius without compensating density, silently dropping paddle
# mass 24.32 -> 15.57 (-36%); the apparent perturbation was a confound. New
# canonical target: paddle -50% with mass preserved, plus the v2-style normal
# delay jitter. Verified zero-shot mean ~67.5 on hist2_motion0 (n=50).
#
# Perturbations (after the engineered-randomization deprecation):
#   1. Movement: pid_kp 9000 -> 7200 (-20%) — softer position controller, slower
#      paddle response to commanded targets.
#   2. Delay: action delay enabled, base delay 0.025 -> 0.030s (+20%).
#      (Note: the older delay-jitter / normal-clipped distribution perturbation
#      is no longer part of the env; the residual gap is now just the base
#      delay shift.)
#   3. Puck-paddle collisions: paddle_radius 0.0508 -> 0.02540 (-50%) with
#      paddle_mass_reference_radius=0.0508 so paddle MASS is preserved against
#      source (effective density auto-scales 3000 -> 12000). Smaller paddle
#      shrinks the contact window without confounding the perturbation with
#      mass loss; recommended residual-RL target per the sweep doc.
#
# Earlier versions of this config also widened the wall-direction cone
# (10 -> 25 deg) as a 4th perturbation; that mechanism has been removed
# from the env, so the perturbation no longer applies. The historical
# context is preserved in
# notes/scratch/sim2sim_delay_puck_perturbation_sweep.md and
# notes/scratch/sim2sim_infra_plan.md.

air_hockey:
  max_timesteps: 250
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  seed: 0

  simulator: box2d
  simulator_params:
    absorb_target: false
    enable_puck_delay_interpolation: true
    block_density: 1000
    block_width: 0.0254
    length: 1.9304
    max_force_timestep: 10000
    paddle_radius: 0.02540                   # PERTURBED: 0.0508 * 0.5 (-50%)
    paddle_mass_reference_radius: 0.0508     # preserve paddle mass against source (density auto-scales 3000 -> 12000)
    force_scaling: 0.99
    paddle_damping: 17
    paddle_density: 3000
    gravity: -0.661
    puck_damping: 0.178
    puck_density: 3000
    puck_restitution: 0.87316
    paddle_restitution: 0.8
    side_wall_restitution: 0.925
    end_wall_restitution: 0.7
    puck_radius: 0.03175
    render_size: 360
    seed: 0
    width: 0.8636
    pid_kp: 7200                    # PERTURBED: 9000 * 0.8 (-20%)
    pid_kd: 50
    pid_ki: 0.0

    hist_len: 4

    puck_noise: true
    puck_noise_std: 0.01
    # Plain spatially-uniform puck occlusion (5% per-step start probability).
    enable_random_occlusions: true
    random_occlusion_rate: 0.05
    enable_action_delay: true       # PERTURBED: false -> true
    enable_observation_delay: true
    delay_seconds: 0.030            # PERTURBED: 0.025 * 1.2 (+20%)

  task: puck_juggle_upper_half_reward
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
