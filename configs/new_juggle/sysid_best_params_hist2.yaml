# Derived from sysid_best_params.yaml — only simulator_params.hist_len differs.
# Temporal-smoothing ablation (2-timestep low-pass on PID target).
# See _filter_update() in airhockey/sims/airhockey_box2d.py.

air_hockey:
  max_timesteps: 250
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  seed: 0

  simulator: box2d
  simulator_params:
    absorb_target: false
    enable_puck_delay_interpolation: true
    block_density: 1000
    block_width: 0.0254
    length: 1.9304
    max_force_timestep: 10000
    paddle_radius: 0.0508
    force_scaling: 0.99
    paddle_damping: 17
    paddle_density: 3000
    gravity: -0.661
    puck_damping: 0.178
    puck_density: 3000
    # Restitution reverted to the v1 (latest_model/hist2_motion0/) values so
    # the v1→v2 difference is purely the collision-randomization knobs below,
    # not the bounce coefficients. See 2026-05-05 zero-shot-ablations decision.
    puck_restitution: 1.09145
    paddle_restitution: 1.0
    side_wall_restitution: 0.99
    end_wall_restitution: 0.7
    puck_radius: 0.03175
    render_size: 360
    seed: 0
    width: 0.8636
    pid_kp: 9000
    pid_kd: 50
    pid_ki: 0.0

    hist_len: 2

    puck_noise: true
    puck_noise_std: 0.01
    # Plain spatially-uniform puck occlusion: 5% per-step probability to start
    # a new occlusion run anywhere on the table; run length is geometric — each
    # extra occluded frame is half as likely as the previous one, capped at 7
    # (random_occlusion_decay / random_occlusion_max_run in airhockey_box2d.py).
    enable_random_occlusions: true
    random_occlusion_rate: 0.05
    enable_action_delay: false
    enable_observation_delay: true
    delay_seconds: 0.025

  task: puck_juggle_upper_half_reward
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
