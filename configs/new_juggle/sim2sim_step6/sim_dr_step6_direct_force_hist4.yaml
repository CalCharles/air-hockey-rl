# Step-6 OOD oracle env (sim2sim, see configs/td3/sim2sim_step6/td3_dr_step6_direct_force_hist4.yaml).
# = configs/new_juggle/sysid_v2_hist4.yaml with
#   - direct_force_control: true (action = paddle force x 1250 N, no low-pass filter / PID; the
#     identify_ood_gap oracle setup, commit 5020937). hist_len only shapes the PID-target filter,
#     so it has no effect here.
#   - per-reset domain randomization of paddle_density / puck_damping / gravity uniformly over the
#     identify_ood_gap step-6 box as used there: [2.0, 2.5] x the sysid-v1 values (paddle_density 3000,
#     puck_damping 0.178, gravity ~-0.659), i.e. [6000, 7500] / [0.356, 0.445] / [-1.648, -1.318].
#     The 5 target envs of runs/td3/sim2sim_step6_direct_force are drawn from this block
#     (sim2sim_online_finetune.py --ranges-from <this file>).
air_hockey:
  max_timesteps: 250
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  seed: 0
  center_offset_constant: 1.3359
  center_offset_constant_y: -0.0376
  simulator: box2d
  simulator_params:
    absorb_target: false
    enable_puck_delay_interpolation: true
    block_density: 1000
    block_width: 0.0254
    length: 1.9304
    max_force_timestep: 10000
    paddle_radius: 0.0508
    force_scaling: 0.99
    paddle_damping: 17
    paddle_density: 3000
    gravity: -0.73
    puck_damping: 0.11
    puck_density: 3000
    puck_restitution: 1.2626
    paddle_restitution: 0.0
    side_wall_restitution: 0.9
    end_wall_restitution: 0.55
    puck_radius: 0.03175
    render_size: 360
    seed: 0
    width: 0.8636
    pid_kp: 7531.5
    pid_ki: 1928.7
    pid_kd: 0.0
    x_min_lim: -0.83
    x_max_lim: -0.45
    y_min: -0.33
    y_max: 0.39
    top_abs: 0.8
    max_bias_p: -0.218
    max_bias_m: -0.266
    hist_len: 4
    puck_noise: true
    puck_noise_std: 0.01
    enable_random_occlusions: true
    random_occlusion_rate: 0.05
    enable_action_delay: false
    enable_observation_delay: true
    delay_seconds: 0.025
    direct_force_control: true
  task: puck_juggle_upper_half_reward
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
  domain_random: true
  random_variables:
  - paddle_density
  - puck_damping
  - gravity
  random_variable_ranges:
    paddle_density:
    - 6000.0
    - 7500.0
    puck_damping:
    - 0.356
    - 0.445
    gravity:
    - -1.648
    - -1.318
