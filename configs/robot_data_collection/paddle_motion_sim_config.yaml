# Box2D env config for open-loop paddle-motion data collection (sim counterpart of
# paddle_motion_config.yaml).
#
# Derived from configs/new_juggle/sysid_best_params_hist2.yaml -- the sysid ground
# truth -- with only the changes needed to make a sim session comparable to a real
# session collected with paddle_motion_config.yaml:
#
#   1. hist_len: 1          -> NO timestep smoothing, same as the real config.
#                              airhockey_box2d._filter_update() mirrors the real
#                              filter_update(); a window of 1 makes the PID target
#                              exactly the clipped per-step target.
#   2. workspace limits     -> x_min_lim / x_max_lim / y_min / y_max / max_bias_*
#                              set to AirHockeyReal's hardcoded values instead of
#                              the Box2D defaults, so clipping saturates at the
#                              same place in both. max_bias_p/-m reproduce what
#                              corner_cut_biases(x_max_lim=-0.42, y_min=-0.35,
#                              y_max=0.39, slope=0.8, y_extent=0.1) derives on the
#                              real side: -0.42 + 0.8*(0.39-0.1) and
#                              -0.42 + 0.8*(0.35-0.1).
#   3. puck_noise / random occlusions off, max_timesteps raised
#                           -> the collector parks and freezes the puck, so puck
#                              observation noise is pure nuisance here; the step
#                              budget has to cover a whole multi-trial session.
#
# Physics (gravity, damping, densities, pid_kp/kd, restitutions, delays) is left
# exactly as sysid fit it. Do not "tune" it here -- that would defeat the point of
# comparing against the real data.
air_hockey:
  max_timesteps: 1000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  seed: 0

  simulator: box2d
  simulator_params:
    absorb_target: false
    enable_puck_delay_interpolation: true
    block_density: 1000
    block_width: 0.0254
    length: 1.9304
    max_force_timestep: 10000
    paddle_radius: 0.0508
    force_scaling: 0.99
    paddle_damping: 17
    paddle_density: 3000
    gravity: -0.661
    puck_damping: 0.178
    puck_density: 3000
    puck_restitution: 1.09145
    paddle_restitution: 1.0
    side_wall_restitution: 0.99
    end_wall_restitution: 0.7
    puck_radius: 0.03175
    render_size: 360
    seed: 0
    width: 0.8636
    pid_kp: 9000
    pid_kd: 50
    pid_ki: 0.0

    hist_len: 1 # no timestep smoothing (see header)

    # Real workspace, so both batteries clip at the same boundary.
    x_min_lim: -0.83
    x_max_lim: -0.42
    y_min: -0.35
    y_max: 0.39
    top_abs: 0.8
    bot_abs: 0.1
    max_bias_p: -0.188
    max_bias_m: -0.22
    rmax_x: 0.26
    rmax_y: 0.12
    center_offset_constant: 1.2

    puck_noise: false
    enable_random_occlusions: false
    enable_action_delay: false
    enable_observation_delay: true
    delay_seconds: 0.025

  task: puck_juggle_upper_half_reward
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
