# Simplified-exploration ablation of the canonical zero-shot DR recipe.
# Copy of td3_paramrand_pm25.yaml with only the four primitive-weight knobs
# changed: keep stand_still + same_direction (random unit direction × uniform
# magnitude, held for 5 steps), drop y_aligned + target_position_directional.
# Weight totals (3.2) and stand_still:others ratio (0.2 : 3.0 = 1:15 → 6.25%
# vs 93.75%) match the canonical config — only the *composition* of "others"
# changes. Trigger probability schedule, takeover_steps, q-updates, PER,
# network, eval_param_seed all identical to the canonical so the only
# variable is exploration composition.
#
# Per-launch overrides via tyro: --seed, --device, --log-parent-dir, --run-name.
#
# Launch:
#   .venv/bin/python -m scripts.td3.td3_training_dr \
#     --args-file configs/td3/zeroshot_paramrand/td3_paramrand_pm25_simple_expl.yaml \
#     --seed 0 --device cuda:2 \
#     --log-parent-dir runs/td3/zeroshot_paramrand/expl_compare/simple_seed0 \
#     --run-name td3_paramrand_pm25_simple_seed0

total_timesteps: 2000000
num_envs: 1

# TD3 core
buffer_size: 100000
tau: 0.005
batch_size: 512
learning_starts: 20000
policy_lr: 0.0003
q_lr: 0.001
q_weight_decay: 0.0001
q_frequency: 1
q_updates: 25
policy_frequency: 1
target_network_frequency: 10
actor_updates_per_iteration: 6
exploration_noise: 0.1
policy_noise: 0.2
noise_clip: 0.5

# Prioritized experience replay
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 200000
per_eps: 0.000001
success_buffer_size: 30000
failure_buffer_size: 70000
success_top_fraction: 0.2
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# Primitive exploration takeover
exploration_primitive_chance: 0.05
exploration_primitive_chance_start: 0.15
exploration_primitive_chance_pre_learning_starts: null
exploration_primitive_chance_anneal_steps: 200000
exploration_primitive_steps: 5

# Exploration after annealing phase (SIMPLIFIED: only stand_still + same_direction;
# same_direction weight = 3.0 to preserve total weight 3.2 and 1:15 ratio
# stand_still:others vs the canonical config).
exploration_primitive_weight_stand_still: 0.2
exploration_primitive_weight_same_direction: 3.0
exploration_primitive_weight_y_aligned: 0.0
exploration_primitive_weight_target_position_directional: 0.0

# Exploration during annealing phase (mirror the same edits)
exploration_primitive_weight_anneal_stand_still: 0.2
exploration_primitive_weight_anneal_same_direction: 3.0
exploration_primitive_weight_anneal_y_aligned: 0.0
exploration_primitive_weight_anneal_target_position_directional: 0.0

# Exploration-specific knobs (unused for the dropped primitives, but kept
# verbatim so any indirect code path that reads them gets the same values).
exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.2
exploration_target_position_max_distance: 0.5
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 5



# Dual-head reward decomposition



# Source sim — hist_len=2 with paddle_density / puck_damping / gravity DR
config: "configs/new_juggle/zeroshot_ablations/sim_paramrand_pm25.yaml"

# Paths (defaults; per-launch --log-parent-dir / --run-name overrides apply)
args_file: null
model_path: null
log_parent_dir: "runs/td3/zeroshot_paramrand/expl_compare/simple_seed0"
run_name: "td3_paramrand_pm25_simple_expl"

# Runtime (per-launch --seed / --device overrides apply)
device: "cuda:2"
seed: 0
h_transform_eps: 0.001

# Architecture (2-layer 64 — matches td3_recommended)
agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
q_hidden_layer_size: 64
q_num_hidden_layers: 2

use_last_action_in_policy_state: true

checkpoint_interval: 25000

# Multi-env evaluation (consumed by td3_training_dr.py wrapper).
# Same seed / n_envs / eps_per_env as canonical so eval set is IDENTICAL across
# baseline/simple arms — apples-to-apples comparison.
eval_param_seed: 12345
eval_n_envs: 5
eval_eps_per_env: 4
