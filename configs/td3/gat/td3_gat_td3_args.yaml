# TD3 fine-tuning args for GAT sim2sim (source = sysid, target = warp075_p30).
#
# The source env (sysid_best_params_hist2.yaml) is wrapped by GATEnvWrapper(τ)
# at runtime, so the training loop sees GAT-transformed transitions.
# Checkpoints are evaluated in the target env (no τ).
#
# Initialise from the paramrand pretrained checkpoint with weights_only so
# the actor weights transfer but critics reset (fresh value estimates for the
# GAT-modified source env).
#
# Hyperparameters follow the canonical big-gap residual recipe
# (phaseC_actor2_1M.yaml) with two changes:
#   • full_checkpoint_load: weights_only  (no residual head, plain actor)
#   • No CQL                              (CQL is specific to residual RL)
#
# Launch:
#   python -m scripts.td3.td3_training_gat \
#     --gat-config configs/td3/gat/td3_gat_sim2sim.yaml \
#     --args-file  configs/td3/gat/td3_gat_td3_args.yaml

total_timesteps: 1000000
num_envs: 1

# TD3 core — matched to phaseC residual recipe for fair comparison.
buffer_size: 20000
tau: 0.005
batch_size: 512
learning_starts: 2000
policy_lr: 0.0003
q_lr: 0.0003
q_weight_decay: 0.001
q_frequency: 1
q_updates: 1
num_critics: 5
policy_frequency: 1
target_network_frequency: 2
actor_updates_per_iteration: 2
exploration_noise: 0.05
policy_noise: 0.2
noise_clip: 0.5

# Prioritized experience replay.
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 50000
per_eps: 1.0e-06
priority_age_decay: 0.0001
success_buffer_size: 6000
failure_buffer_size: 14000
success_top_fraction: 0.15
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7

# No exploration primitives (same as residual recipe for fair comparison).
exploration_primitive_chance: 0.0
exploration_primitive_chance_start: 0.0
exploration_primitive_chance_pre_learning_starts: 0.0
exploration_primitive_chance_anneal_steps: 50000
exploration_primitive_steps: 5
exploration_primitive_weight_stand_still: 0.0
exploration_primitive_weight_same_direction: 1.0
exploration_primitive_weight_y_aligned: 0.0
exploration_primitive_weight_target_position_directional: 0.0
exploration_primitive_weight_anneal_stand_still: 0.0
exploration_primitive_weight_anneal_same_direction: 1.0
exploration_primitive_weight_anneal_y_aligned: 0.0
exploration_primitive_weight_anneal_target_position_directional: 0.0
exploration_direction_y_component_weight: 2
exploration_target_position_min_distance: 0.2
exploration_target_position_max_distance: 0.5
exploration_target_position_delta_x: 0.26
exploration_target_position_delta_y: 0.12
exploration_target_position_steps: 5

# Reward decomposition — task-only (same as residual recipe).

# Source env for fine-tuning (wrapped by GATEnvWrapper at runtime).
config: "configs/new_juggle/sysid_best_params_hist2.yaml"
enable_puck_delay_interpolation: true

# Pretrained paramrand checkpoint — update path before running.
model_path: "latest_models/canonical/hist2_motion0_v2/model.pth"
full_checkpoint_load: weights_only

# No CQL or residual head (GAT is a separate adaptation mechanism).
cql_alpha: 0.0
residual_scale: 0.25

checkpoint_interval: 10000
args_file: null

# Update before running.
log_parent_dir: "runs/"
run_name: "gat_warp075_p30_seed0"
device: "cuda:0"
seed: 0

action_scale: 1.0
h_transform_eps: 0.001
agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
q_hidden_layer_size: 64
q_num_hidden_layers: 2
use_last_action_in_policy_state: true
