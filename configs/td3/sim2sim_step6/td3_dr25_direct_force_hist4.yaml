# Source policy of the sim2sim step-6 direct-force experiment: the policy evaluated zero-shot in, and
# fine-tuned online in, the 5 step-6 target envs (runs/td3/sim2sim_step6_direct_force/envs.json).
# = configs/td3/sysid_v2_hist/juggle_sysid_v2_hist4.yaml (canonical hist4 TD3 recipe) with the sim config
# above (+-25 % DR around sysid-v2, direct force), 3M steps, only the final checkpoint, and
# td3_training_dr's multi-env eval at the final checkpoint.
# Train with scripts/td3/td3_training_dr.py; launcher: scripts/td3/run_sim2sim_step6_train.sh source.
total_timesteps: 3000000
num_envs: 1
buffer_size: 100000
tau: 0.005
batch_size: 512
learning_starts: 20000
policy_lr: 0.0003
q_lr: 0.001
q_weight_decay: 0.0
q_frequency: 1
q_updates: 25
policy_frequency: 1
target_network_frequency: 10
actor_updates_per_iteration: 6
exploration_noise: 0.1
policy_noise: 0.2
noise_clip: 0.5
per_enabled: true
per_alpha: 0.6
per_beta_start: 0.4
per_beta_end: 1.0
per_beta_anneal_steps: 200000
per_eps: 1.0e-06
success_buffer_size: 1000000
failure_buffer_size: 70000
success_top_fraction: 0.5
recent_episode_window_size: 500
critic_success_sample_fraction: 0.3
critic_failure_sample_fraction: 0.7
single_replay_buffer: true
exploration_primitive_chance: 0.05
exploration_primitive_chance_start: 0.15
exploration_primitive_chance_pre_learning_starts: null
exploration_primitive_chance_anneal_steps: 200000
exploration_primitive_steps: 5
exploration_primitive_weight_stand_still: 0.2
exploration_primitive_weight_same_direction: 3.0
exploration_primitive_weight_anneal_stand_still: 0.2
exploration_primitive_weight_anneal_same_direction: 3.0
exploration_direction_y_component_weight: 2
config: configs/new_juggle/sim2sim_step6/sim_dr25_direct_force_hist4.yaml
args_file: null
model_path: null
log_parent_dir: null
run_name: dr25_direct_force_hist4
device: cuda:0
seed: 0
h_transform_eps: 0.001
agent_hidden_layer_size: 64
agent_num_hidden_layers: 2
q_hidden_layer_size: 64
q_num_hidden_layers: 2
use_last_action_in_policy_state: true
checkpoint_interval: 0
eval_param_seed: 12345
eval_n_envs: 5
eval_eps_per_env: 4
