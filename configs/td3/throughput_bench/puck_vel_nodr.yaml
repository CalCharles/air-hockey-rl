exploration_direction_y_component_weight: 2
config: configs/new_juggle/throughput_bench/sim_nodr_puck_vel.yaml
args_file: null
model_path: null
log_parent_dir: null
run_name: bench_puck_vel_nodr
device: cuda:0
seed: 0
h_transform_eps: 0.001
agent_hidden_layer_size: 64
