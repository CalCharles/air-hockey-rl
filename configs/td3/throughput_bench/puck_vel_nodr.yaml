# Throughput benchmark (no-DR sysid recipe) on task 'puck_vel'.
# Derived from configs/td3/td3_recommended_top50_hist2.yaml
# with a 100k-step budget. Runner: scripts/td3/extras/throughput_bench.py
total_timesteps: 100000
num_envs: 1
buffer_size: 100000
tau: 0.005
batch_size: 512
learning_starts: 20000
policy_lr: 0.0003
q_lr: 0.001
q_weight_decay: 0.0001
