# Task 1: seeds 1-4 of term03_weak3_pout2 (seed 0 in shape_screen3), the steadiest strike variant of round 3.
name: shape_seeds_term03
base_args: configs/ceiling/base_td3_hist4.yaml
seeds:
- 0
variants:
- name: term03_weak3_pout2
  trainer: scripts.rma.train_base_policy
  seeds:
  - 1
  - 2
  - 3
  - 4
  args:
    train_every_steps: 32
    q_updates: 8
    actor_updates_per_iteration: 2
    gamma: 0.995
    actor_pre_tanh_penalty: 0.001
    total_timesteps: 3000000
    rma_mode: history_privileged
    rma_latent_dim: 8
    history_len: 50
    step_features: latest_frame
    history_embed_dim: 32
    history_conv_channels: 32
    eval_param_seed: 12345
    shape_edge_coef: 0.5
    shape_edge_term_margin: 0.03
    shape_weak_coef: 3.0
    shape_pout_coef: 2.0
  sim:
    max_timesteps: 2000
    random_variables:
    - paddle_density
    - puck_damping
    - gravity
    random_variable_ranges:
      paddle_density:
      - 2250.0
      - 3750.0
      puck_damping:
      - 0.0825
      - 0.1375
      gravity:
      - -0.9125
      - -0.5475
