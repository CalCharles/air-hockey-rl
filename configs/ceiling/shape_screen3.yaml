# Natural-strike shaping, round 3 (Task 1). Round 2 (shape_screen2): only the weak-contact penalty
# plus puck-exit bonus (edgehit3_weak3_pout2) produced hist4-like strikes; the other terms gave off-edge
# stationary blocks. This sweep: seeds 1-4 of edgehit3_weak3_pout2 (seed 0 is in shape_screen2) and
# variants of it aimed at steadier survival. 3M steps.
