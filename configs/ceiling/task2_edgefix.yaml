# Task 2: the final ceiling recipe (final_privcritic_pretanh.yaml, unchanged) trained on the sim with the
# top-edge paddle velocity fix (scripts/rma/edge_velocity_fix.py: a training-side instance patch that removes the
# paddle's outward velocity when the workspace clip pins it; airhockey/ is not modified). Undo: drop
# edge_velocity_fix. 5 seeds, 3M steps.
name: task2_edgefix
base_args: configs/ceiling/base_td3_hist4.yaml
seeds: [0, 1, 2, 3, 4]
variants:
  - name: hist50_privcritic_pretanh_edgefix
    trainer: scripts.rma.train_base_policy
    args: {train_every_steps: 32, q_updates: 8, actor_updates_per_iteration: 2, gamma: 0.995, actor_pre_tanh_penalty: 0.001, total_timesteps: 3000000, rma_mode: history_privileged,
           rma_latent_dim: 8, history_len: 50, step_features: latest_frame, history_embed_dim: 32,
           history_conv_channels: 32, eval_param_seed: 12345, edge_velocity_fix: true}
    sim: {max_timesteps: 2000, random_variables: [paddle_density, puck_damping, gravity],
          random_variable_ranges: {paddle_density: [2250., 3750.], puck_damping: [0.0825, 0.1375], gravity: [-0.9125, -0.5475]}}
