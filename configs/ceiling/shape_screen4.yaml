# Natural-strike shaping, round 4 (Task 1): the round-2/3 strike recipe edgehit3_weak3_pout2 swings from rest
# (1-4 cm backswing vs hist4's 9-24 cm); add a contact bonus on the backswing (shape_cock_coef, 10 cm ref). 3M steps.
name: shape_screen4
base_args: configs/ceiling/base_td3_hist4.yaml
seeds: [0]
variants:
  - name: edgehit3_weak3_pout2_cock1
    trainer: scripts.rma.train_base_policy
    args: {train_every_steps: 32, q_updates: 8, actor_updates_per_iteration: 2, gamma: 0.995, actor_pre_tanh_penalty: 0.001, total_timesteps: 3000000, rma_mode: history_privileged, rma_latent_dim: 8, history_len: 50, step_features: latest_frame, history_embed_dim: 32, history_conv_channels: 32, eval_param_seed: 12345, shape_edge_coef: 0.5, shape_edge_hit_coef: 3.0, shape_weak_coef: 3.0, shape_pout_coef: 2.0, shape_cock_coef: 1.0}
    sim: {max_timesteps: 2000, random_variables: [paddle_density, puck_damping, gravity], random_variable_ranges: {paddle_density: [2250., 3750.], puck_damping: [0.0825, 0.1375], gravity: [-0.9125, -0.5475]}}
  - name: edgehit3_weak3_pout2_cock3
    trainer: scripts.rma.train_base_policy
    args: {train_every_steps: 32, q_updates: 8, actor_updates_per_iteration: 2, gamma: 0.995, actor_pre_tanh_penalty: 0.001, total_timesteps: 3000000, rma_mode: history_privileged, rma_latent_dim: 8, history_len: 50, step_features: latest_frame, history_embed_dim: 32, history_conv_channels: 32, eval_param_seed: 12345, shape_edge_coef: 0.5, shape_edge_hit_coef: 3.0, shape_weak_coef: 3.0, shape_pout_coef: 2.0, shape_cock_coef: 3.0}
    sim: {max_timesteps: 2000, random_variables: [paddle_density, puck_damping, gravity], random_variable_ranges: {paddle_density: [2250., 3750.], puck_damping: [0.0825, 0.1375], gravity: [-0.9125, -0.5475]}}
