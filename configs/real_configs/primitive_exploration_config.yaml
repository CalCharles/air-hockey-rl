air_hockey:
  diagonal_motion_rew: -0.1
  direction_change_rew: -0.05
  goal_max_x_velocity: 1
  goal_max_y_velocity: 5
  goal_min_y_velocity: 1
  horizontal_vel_rew: -0.1
  max_timesteps: 1000
  n_training_steps: 10000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  simulator: real
  simulator_params:
    absorb_target: false
    block_density: 500
    block_width: 0.0254
    force_scaling: 1000
    gravity: -0.5
    length: 1.9304
    max_force_timestep: 100
    paddle_damping: 3
    paddle_density: 2500
    paddle_radius: 0.0508
    puck_damping: 0.5
    puck_density: 250
    puck_radius: 0.03175
    render_size: 360
    wall_bounce_scale: 0.02
    width: 0.8636
    control_mode: RL
    wait_for_space_to_start: true
    save_path: ./data/rollout/temp_saving/primitive_runner
    debug_control: true
    debug_control_every: 5
    transition_hold_steps_on_estop_enter: 0
    transition_hold_steps_on_estop_clear: 8
    transition_hold_steps_on_safety_rearm: 3
    transition_hold_debug: false
  stand_still_rew: 0.01
  task: puck_velocity
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: true
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: true
  truncate_rew: -1
  wall_bumping_rew: -1
algorithm: ppo
eval_freq: 5000
gamma: 0.99
model_save_filepath: model
n_eval_eps: 30
n_threads: 8
n_training_steps: 1000000
print_reward: false
seed:
- 0
- 1
- 2
- 3
- 4
tb_log_dir: baseline_models
tb_log_name: air_hockey_agent
vec_normalize_save_filepath: vec_normalize.pkl



primitive_runner:
  primitive_name: target_position_directional
  base_action_mode: zero
  random_action_std: 0.5
  device: cpu
  hard_reset_pause_s: 3.0
  log_every: 25

  # Supported real-runner primitives: stand_still, same_direction, y_aligned, target_position_directional
  exploration_primitive_steps: 5
  exploration_target_position_steps: 5

  # Angles are in simulator displacement coordinates:
  #   0 deg = +x, 90 deg = +y, 180/-180 deg = -x, -90 deg = -y
  # The sampler is uniform over [min_angle_deg, max_angle_deg].
  # To cover the full circle, use [-180, 180], [0, 360], or any span >= 360 deg.
  exploration_same_direction_min_angle_deg: -180.0
  exploration_same_direction_max_angle_deg: 180.0
  exploration_same_direction_min_magnitude: 0.00
  exploration_same_direction_max_magnitude: 0.20

  # `y_aligned` samples from this angle band, then mirrors the y-sign to match puck-vs-paddle alignment.
  exploration_y_aligned_min_angle_deg: 45.0
  exploration_y_aligned_max_angle_deg: 135.0
  exploration_y_aligned_min_magnitude: 0.075
  exploration_y_aligned_max_magnitude: 0.20

  exploration_target_position_directional_min_angle_deg: -180.0
  exploration_target_position_directional_max_angle_deg: 180.0
  exploration_target_position_directional_min_magnitude: 0.0
  exploration_target_position_directional_max_magnitude: 0.25

  # Real simulator action mapping: dx = action_x * delta_x, dy = action_y * delta_y
  exploration_target_position_delta_x: 0.26
  exploration_target_position_delta_y: 0.12
