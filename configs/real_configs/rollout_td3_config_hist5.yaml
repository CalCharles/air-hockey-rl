# Variant of rollout_td3_config.yaml for checkpoints trained with hist_len=3
# (e.g. latest_model/hist3_motion0/, sysid_best_params_hist3.yaml). The rest
# of the real-world env setup is identical to rollout_td3_config.yaml; the
# only delta is `simulator_params.hist_len: 3` so the observation dim matches
# the trained actor/critic input shape.
air_hockey:
  diagonal_motion_rew: 0.0
  direction_change_rew: 0.0
  goal_max_x_velocity: 1
  goal_max_y_velocity: 5
  goal_min_y_velocity: 1
  horizontal_vel_rew: 0.0
  max_timesteps: 1000
  n_training_steps: 10000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history # history # vel
  simulator: real
  simulator_params:
    absorb_target: false
    block_density: 500
    block_width: 0.0254
    force_scaling: 1000
    gravity: -0.5
    length: 1.9304
    max_force_timestep: 100
    paddle_damping: 3
    paddle_density: 2500
    paddle_radius: 0.0508
    puck_damping: 0.5
    puck_density: 250
    puck_hit_bottom_boundary_m: 0.2
    puck_radius: 0.03175
    render_size: 360
    wall_bounce_scale: 0.02
    width: 0.8636
    control_mode: RL
    wait_for_space_to_start: true
    save_path: ./data/rollout/temp_saving/RL_test
    debug_control: true
    debug_control_every: 5
    # Must match the training sim config's hist_len (sysid_best_params_hist3.yaml).
    # Determines the length of the paddle/puck history buffers that feed into
    # obs_type=history observations; obs dim and the actor's input layer shape
    # both depend on it.
    hist_len: 5
    # Optional simulator-side recovery/transition holds for standalone real rollouts.
    # Async TD3 can override these from its own args file / CLI transition_hold_steps_* flags.
    transition_hold_steps_on_estop_enter: 0
    transition_hold_steps_on_estop_clear: 8
    transition_hold_steps_on_safety_rearm: 3
    transition_hold_debug: false
    async_render_enabled: true
    async_render_sim_view_enabled: true
    # Async z-force worker is broken (RTDE register conflict); force the sync
    # clamp path until the threads+lock redesign lands. See
    # notes/docs/environments/real-world/async-z-force-future-steps.md
    async_z_force_enabled: false
  stand_still_rew: 0.01
  task: puck_juggle_upper_half_reward
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: true
  truncate_rew: 0
  wall_bumping_rew: 0



# NOT USED
algorithm: ppo
eval_freq: 5000
gamma: 0.99
model_save_filepath: model
n_eval_eps: 30
n_threads: 8
n_training_steps: 1000000
print_reward: false
seed:
- 0
- 1
- 2
- 3
- 4
tb_log_dir: baseline_models
tb_log_name: air_hockey_agent
vec_normalize_save_filepath: vec_normalize.pkl
