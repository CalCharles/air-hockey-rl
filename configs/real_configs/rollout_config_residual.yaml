# Real-world rollout config for residual TD3 training.
#
# Reward MUST match what the frozen base actor was trained against and what
# sim2sim residual fine-tuning uses, so train-time and fine-tune-time task
# rewards are the same signal:
#   - Canonical sim:   configs/new_juggle/sysid_best_params.yaml
#                      → task: puck_juggle_upper_half_reward
#   - Sim2sim residual: configs/new_juggle/sim2sim_combined.yaml
#                      → task: puck_juggle_upper_half_reward
# Hence `task: puck_juggle_upper_half_reward` below (+1 per step while puck is
# in the upper half of the table; see AirHockeyPuckJuggleUpperHalfReward).
#
# Pointed at by: configs/td3_real_world/td3_residual.yaml
air_hockey:
  max_timesteps: 1000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history # history # vel
  simulator: real
  simulator_params:
    absorb_target: false
    block_density: 500
    block_width: 0.0254
    force_scaling: 1000
    gravity: -0.5
    length: 1.9304
    max_force_timestep: 100
    paddle_damping: 3
    paddle_density: 2500
    paddle_radius: 0.0508
    puck_damping: 0.5
    puck_density: 250
    puck_hit_bottom_boundary_m: 0.2
    puck_radius: 0.03175
    render_size: 360
    wall_bounce_scale: 0.02
    width: 0.8636
    control_mode: RL
    wait_for_space_to_start: true
    save_path: ./data/rollout/temp_saving/RL_test
    debug_control: true
    debug_control_every: 5
    # Optional simulator-side recovery/transition holds for standalone real rollouts.
    # Async TD3 can override these from its own args file / CLI transition_hold_steps_* flags.
    transition_hold_steps_on_estop_enter: 0
    transition_hold_steps_on_estop_clear: 8
    transition_hold_steps_on_safety_rearm: 3
    transition_hold_debug: false
    # async_render_enabled: true
  task: puck_juggle_upper_half_reward
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: true
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: true
