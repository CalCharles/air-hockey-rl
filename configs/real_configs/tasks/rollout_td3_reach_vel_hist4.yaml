# Real-world TD3 rollout / eval config for the `paddle_reach_position_velocity` task, hist4
# (PID-target smoother window = 4). Generated from
# rollout_td3_config_hist4.yaml (real simulator block) + tasks/sim_sysid_reach_vel.yaml
# (task keys: budget, puck count, termination flags, goal params).
# Pair with five_tasks_best_checkpoints_20260908/hist4/reach_vel_*/.
#
# Eval entrypoint: scripts/td3/extras/async_td3_real_eval.py — the task name
# selects the reset strategy and metrics automatically
# (scripts/td3/helper/real_task_eval_hooks.py).
air_hockey:
  max_timesteps: 100
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 0
  num_targets: 0
  obs_type: history
  simulator: real
  simulator_params:
    absorb_target: false
    block_density: 500
    block_width: 0.0254
    force_scaling: 1000
    gravity: -0.5
    hist_len: 4
    length: 1.9304
    max_force_timestep: 100
    paddle_damping: 3
    paddle_density: 2500
    paddle_radius: 0.0508
    puck_damping: 0.5
    puck_density: 250
    puck_hit_bottom_boundary_m: 0.2
    puck_radius: 0.03175
    render_size: 360
    wall_bounce_scale: 0.02
    width: 0.8636
    control_mode: RL
    wait_for_space_to_start: true
    save_path: ./data/rollout/temp_saving/RL_test
    debug_control: true
    debug_control_every: 5
    transition_hold_steps_on_estop_enter: 0
    transition_hold_steps_on_estop_clear: 8
    transition_hold_steps_on_safety_rearm: 3
    transition_hold_debug: false
    async_render_enabled: true
    async_render_sim_view_enabled: true
  task: paddle_reach_position_velocity
  terminate_on_enemy_goal: false
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: false
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: false
  terminate_on_puck_stop: false
  goal_radius_type: fixed
  base_goal_radius: 0.05
  return_goal_obs: false
  goal_max_x_velocity: 1
  goal_max_y_velocity: 5
  goal_min_y_velocity: 1
