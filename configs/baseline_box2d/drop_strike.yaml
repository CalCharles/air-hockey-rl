air_hockey:
  goal_max_x_velocity: 1
  goal_max_y_velocity: 5
  goal_min_y_velocity: 1
  max_timesteps: 250
  n_training_steps: 1000000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: history
  return_goal_obs: false
  seed: 0

  # Upper-half dropping spawn profile (mirrors juggle sysid behavior).
  puck_linear_top_spawn_goal_cutoff_x: null
  puck_linear_top_spawn_center_cutoff_x: 0.2
  puck_linear_top_spawn_speed_min: 0.0
  puck_linear_top_spawn_speed_max: 0.5

  simulator: box2d
  simulator_params:
    absorb_target: false
    block_density: 1000
    block_width: 0.0254
    length: 1.9304
    max_force_timestep: 10000
    paddle_radius: 0.0508
    force_scaling: 0.99
    paddle_damping: 17
    paddle_density: 3000
    gravity: -0.661
    puck_damping: 0.178
    puck_density: 3000
    puck_restitution: 1.09145
    paddle_restitution: 1.0
    side_wall_restitution: 0.99
    end_wall_restitution: 0.7
    puck_radius: 0.03175
    render_size: 360
    seed: 0
    width: 0.8636
    pid_kp: 9000
    pid_kd: 50
    pid_ki: 0.0
    hist_len: 2

  task: puck_strike
  puck_spawn_mode: linear_top
  puck_spawn_affected_by_gravity: true
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: false
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_hit_paddle: false
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
  truncate_rew: 0
  base_reward_scaling: 1
algorithm: ppo
eval_freq: 5000
gamma: 0.99
model_save_filepath: model
n_eval_eps: 30
n_threads: 1
n_training_steps: 1000000
print_reward: false
seed:
- 0
- 1
- 2
- 3
- 4
tb_log_dir: baseline_models
tb_log_name: drop_strike
vec_normalize_save_filepath: vec_normalize.pkl
