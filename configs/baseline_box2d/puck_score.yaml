air_hockey:
  goal_max_x_velocity: 1
  goal_max_y_velocity: 5
  goal_min_y_velocity: 1
  max_timesteps: 600
  n_training_steps: 1000000
  num_blocks: 0
  num_obstacles: 0
  num_paddles: 1
  num_pucks: 1
  num_targets: 0
  obs_type: pos # history # vel
  return_goal_obs: false
  seed: [0, 1, 2, 3, 4]
  simulator: box2d
  simulator_params:
    absorb_target: false
    block_density: 500
    block_width: 0.0254
    force_scaling: 1000
    gravity: -0.5
    length: 1.9304
    max_force_timestep: 100
    paddle_damping: 3
    paddle_density: 1500
    paddle_radius: 0.0508
    puck_damping: 0.5
    puck_density: 250
    puck_radius: 0.03175
    render_size: 360
    wall_bounce_scale: 0.02
    width: 0.8636
  task: puck_score
  # Top-edge goal strip in y: default is middle third of table width (omit key or use null).
  # top_edge_goal_slot_half_width_y_m: null
  # Optional puck spawn (same knobs as juggle linear-top / puck_strike):
  # puck_spawn_mode: score_default  # or linear_top
  # puck_spawn_affected_by_gravity: true
  # puck_spawn_near_paddle_prob: 0.0
  # puck_near_paddle_offset_min_m / puck_near_paddle_offset_max_m
  # puck_near_paddle_horizontal_std_m, puck_near_paddle_speed_min_m_s, puck_near_paddle_speed_max_m_s
  # puck_spawn_fixed_x_from_goal_frac: null
  # puck_linear_top_spawn_center_cutoff_x, puck_linear_top_spawn_goal_cutoff_x, puck_linear_top_spawn_speed_min/max
  terminate_on_enemy_goal: true
  terminate_on_out_of_bounds: true
  terminate_on_puck_hit_bottom: true
  terminate_on_puck_pass_paddle: true
  terminate_on_puck_stop: false
  truncate_rew: -10
algorithm: ppo
eval_freq: 5000
gamma: 0.99
model_save_filepath: box2d_models
n_eval_eps: 30
n_threads: 8
n_training_steps: 1000000
print_reward: false
seed: 0
tb_log_dir: box2d_models
tb_log_name: puck_score
vec_normalize_save_filepath: vec_normalize.pkl
