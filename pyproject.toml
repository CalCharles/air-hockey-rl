# TODO: build-system may need additional configuration

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'"
]

[project]
name = "airhockey"
version = "0.1.0"
description = "Environment for Air Hockey"
readme = "README.md"
authors = [
    {name = "Michael Munje", email = "michaelmunje@utexas.edu"}
]
requires-python = ">=3.10"

dependencies = [
    "gymnasium",
    "gym==0.25.1",
    "swig",
    "box2d",
    "tqdm",
    "h5py",
    "xmltodict",
    "pyyaml",
    "ur-rtde",
    "matplotlib>=3.10.9",
    "imageio>=2.37.3",
]

[project.optional-dependencies]
train = [
    "opencv-python",
    "tensorboard",
    "wandb",
    "pyrallis",
    "torch==2.11.0",
    "stable-baselines3",
    "scikit-learn",
    "tyro",
    "transformers",
]

[project.urls]
Repository = "https://github.com/CalCharles/air-hockey-rl"

[tool.setuptools.packages.find]
# This ensures find_packages() behavior is preserved - automatically discovers packages
